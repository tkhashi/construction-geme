<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>検証試作 アイソメ2.5D現場ビュー</title>
    <style>
      :root {
        --bg: #eef1f4;
        --panel: #ffffff;
        --panel-2: #f4f6f8;
        --ink: #1d2733;
        --ink-2: #5b6a78;
        --line: #d5dce2;
        --accent: #2563eb;
        --accent-ink: #ffffff;
        --warn: #d64545;
        --chip: #e8edf1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141a20;
          --panel: #1e262f;
          --panel-2: #242f3a;
          --ink: #e8eef3;
          --ink-2: #9db0bf;
          --line: #37434f;
          --accent: #5b8cff;
          --accent-ink: #0d1522;
          --chip: #2b3742;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP",
          "Yu Gothic UI", "Yu Gothic", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ---------- header ---------- */
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        flex-wrap: wrap;
      }
      .day-badge {
        display: flex;
        align-items: baseline;
        gap: 6px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 5px 12px;
      }
      .day-badge .d {
        font-size: 22px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .day-badge .of { font-size: 12px; color: var(--ink-2); }
      .phase {
        font-size: 15px;
        font-weight: 700;
        background: var(--panel);
        border: 1px solid var(--line);
        border-left: 5px solid var(--accent);
        border-radius: 8px;
        padding: 6px 12px;
      }
      .meters {
        display: flex;
        gap: 14px;
        margin-left: auto;
        align-items: center;
        flex-wrap: wrap;
      }
      .meter { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
      .meter .bar {
        width: 92px; height: 9px;
        background: var(--chip);
        border-radius: 99px;
        overflow: hidden;
        position: relative;
      }
      .meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; }
      .meter .fill.plan { background: repeating-linear-gradient(45deg, #7db3f0 0 5px, #a9ccf5 5px 10px); }
      .meter .fill.act { background: #3f9e4d; }
      .meter b { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 34px; }
      .lag {
        font-size: 12px; font-weight: 700; color: var(--warn);
        background: color-mix(in srgb, var(--warn) 12%, transparent);
        border-radius: 99px; padding: 3px 9px;
        display: none;
      }
      .lag.on { display: inline-block; }

      /* ---------- stage ---------- */
      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
        margin: 0 10px;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: #bfe0ee;
      }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }

      .note {
        position: absolute;
        left: 10px; bottom: 8px;
        font-size: 11px;
        color: #33505f;
        background: rgba(255,255,255,.72);
        border-radius: 6px;
        padding: 3px 8px;
        pointer-events: none;
        z-index: 3;
      }
      .event-cap {
        position: absolute;
        top: 10px; left: 50%;
        transform: translateX(-50%);
        font-size: 13px; font-weight: 700;
        color: #17303f;
        background: rgba(255,255,255,.88);
        border: 1px solid rgba(23,48,63,.18);
        border-radius: 99px;
        padding: 5px 14px;
        white-space: nowrap;
        display: none;
        pointer-events: none;
        z-index: 4;
        max-width: calc(100% - 16px);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .event-cap.on { display: block; }

      /* ---------- 吹き出し（会話の可視化） ---------- */
      #bubLayer {
        position: absolute; inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 5;
      }
      .bub {
        position: absolute;
        max-width: 178px;
        background: #ffffff;
        color: #17303f;
        border: 1.5px solid rgba(23,48,63,.35);
        border-radius: 10px;
        padding: 5px 8px 6px;
        font-size: 11.5px;
        line-height: 1.35;
        box-shadow: 0 3px 10px rgba(15,30,45,.22);
      }
      .bub .who {
        display: inline-block;
        font-size: 9.5px; font-weight: 800;
        color: #ffffff;
        border-radius: 99px;
        padding: 0.5px 6px;
        margin-bottom: 2px;
      }
      .bub .tail {
        position: absolute;
        width: 9px; height: 9px;
        background: #ffffff;
        border-right: 1.5px solid rgba(23,48,63,.35);
        border-bottom: 1.5px solid rgba(23,48,63,.35);
        transform: rotate(45deg);
      }
      .bub.phone { border-color: #7a4fd0; background: #f6f1ff; }
      .bub.phone .tail { background: #f6f1ff; border-color: #7a4fd0; }
      .bubmini {
        position: absolute;
        font-size: 13px;
        background: rgba(255,255,255,.9);
        border: 1px solid rgba(23,48,63,.3);
        border-radius: 99px;
        padding: 1px 5px;
        box-shadow: 0 2px 6px rgba(15,30,45,.2);
      }
      .caller-chip {
        position: absolute;
        right: 10px; top: 52px;
        display: none;
        align-items: center; gap: 7px;
        background: #f6f1ff;
        border: 1.5px solid #7a4fd0;
        color: #3d2470;
        border-radius: 99px;
        padding: 4px 11px 4px 5px;
        font-size: 11.5px; font-weight: 700;
        box-shadow: 0 3px 10px rgba(15,30,45,.2);
        z-index: 6;
      }
      .caller-chip.on { display: inline-flex; }
      .caller-chip .av {
        width: 22px; height: 22px; border-radius: 50%;
        background: #7a4fd0; color: #fff;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: 800;
      }

      /* ---------- info card ---------- */
      .card {
        position: absolute;
        top: 10px; left: 10px;
        width: 252px;
        max-width: calc(100% - 20px);
        max-height: calc(100% - 20px);
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(15, 30, 45, .18);
        padding: 12px 14px;
        display: none;
        z-index: 7;
      }
      .card.on { display: block; }
      .card h2 { margin: 0 26px 2px 0; font-size: 16px; }
      .card .work { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
      .card .close {
        position: absolute; top: 8px; right: 8px;
        width: 26px; height: 26px;
        border: none; border-radius: 8px;
        background: var(--chip); color: var(--ink);
        font-size: 14px; line-height: 1; cursor: pointer;
      }
      .foreman { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
      .avatar {
        width: 40px; height: 40px; border-radius: 50%;
        flex: none;
        display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 16px; color: #fff;
        border: 3px solid #f5c542;
      }
      .foreman .who { font-size: 13px; font-weight: 700; }
      .foreman .tag { font-size: 11.5px; color: var(--ink-2); }
      .card .row { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; padding: 2.5px 0; }
      .card .row span:first-child { color: var(--ink-2); }
      .card .row b { font-variant-numeric: tabular-nums; text-align: right; }
      .card .row b.gate { color: var(--warn); }
      .pbar { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; margin: 6px 0 4px; position: relative; }
      .pbar .pf { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(45deg, #7db3f0 0 5px, #a9ccf5 5px 10px); }
      .pbar .af { position: absolute; inset: 0 auto 0 0; background: #3f9e4d; border-radius: 99px; }
      .hint {
        position: absolute;
        top: 10px; left: 10px;
        font-size: 12.5px;
        color: #33505f;
        background: rgba(255,255,255,.85);
        border-radius: 8px;
        padding: 6px 10px;
        pointer-events: none;
        z-index: 4;
      }
      .hint.gone { display: none; }

      /* ---------- controls ---------- */
      .controls {
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .ctl-row { display: flex; align-items: center; gap: 10px; }
      .btn {
        flex: none;
        height: 42px; min-width: 46px;
        padding: 0 12px;
        border-radius: 11px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        font-size: 14px; font-weight: 700;
        cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      .btn svg { display: block; }
      input[type="range"] {
        flex: 1;
        -webkit-appearance: none;
        appearance: none;
        height: 30px;
        background: transparent;
        cursor: pointer;
        min-width: 80px;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 8px; border-radius: 99px;
        background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--chip) var(--p, 0%));
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 26px; height: 26px; margin-top: -9px;
        border-radius: 50%;
        background: var(--panel);
        border: 3px solid var(--accent);
        box-shadow: 0 2px 6px rgba(0,0,0,.25);
      }
      input[type="range"]::-moz-range-track { height: 8px; border-radius: 99px; background: var(--chip); }
      input[type="range"]::-moz-range-progress { height: 8px; border-radius: 99px; background: var(--accent); }
      input[type="range"]::-moz-range-thumb {
        width: 20px; height: 20px; border-radius: 50%;
        background: var(--panel); border: 3px solid var(--accent);
      }
      .legend {
        display: flex; gap: 6px 12px; flex-wrap: wrap;
        font-size: 11.5px; color: var(--ink-2);
        align-items: center;
      }
      .legend .li { display: inline-flex; align-items: center; gap: 5px; }
      .legend .dot { width: 11px; height: 11px; border-radius: 3px; flex: none; }
      .legend .ghostdot {
        width: 11px; height: 11px; border-radius: 3px; flex: none;
        background: rgba(110,170,255,.25);
        border: 1.5px dashed #5b8cff;
      }
      .ctl-row.wrap { flex-wrap: wrap; }
      .flabel { font-size: 12.5px; font-weight: 700; color: var(--ink-2); flex: none; }
      .fbtn { height: 38px; min-width: 44px; padding: 0 11px; font-size: 13px; }
      .fstatus { font-size: 12px; color: var(--ink-2); }

      /* ---------- 物件パラメータパネル ---------- */
      .params {
        margin: 0 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px 12px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .params .prow {
        display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap;
      }
      .params label {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 12.5px; font-weight: 700; color: var(--ink-2);
      }
      .params select {
        height: 34px;
        padding: 0 8px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--ink);
        font-size: 13.5px; font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
      .params select:disabled { opacity: .45; cursor: not-allowed; }
      .params .summary {
        font-size: 13px; font-weight: 800; color: var(--ink);
      }
      .params .summary .sub { font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
      .params .prule {
        font-size: 12px; font-weight: 700; color: var(--warn);
        display: none;
      }
      .params .prule.on { display: block; }
      @media (max-width: 560px) {
        .meters { margin-left: 0; }
        .meter .bar { width: 64px; }
        .day-badge .d { font-size: 19px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="day-badge"><span class="d" id="dayNum">0</span><span class="of">日目 / <span id="totalDays">60</span>日</span></div>
      <div class="phase" id="phaseName">土工事</div>
      <div class="meters">
        <div class="meter">計画
          <div class="bar"><div class="fill plan" id="planFill" style="width:0%"></div></div>
          <b id="planPct">0%</b>
        </div>
        <div class="meter">実績
          <div class="bar"><div class="fill act" id="actFill" style="width:0%"></div></div>
          <b id="actPct">0%</b>
        </div>
        <div class="meter">部材 <b id="memCount" style="min-width:0">0 / 0</b></div>
        <span class="lag" id="lagBadge">約3日遅れ</span>
      </div>
    </header>

    <div class="params" id="paramPanel">
      <div class="prow">
        <label>敷地形状
          <select id="prmSite">
            <option value="rect">矩形</option>
            <option value="trap">台形</option>
            <option value="L">L字敷地</option>
          </select>
        </label>
        <label>建物形状
          <select id="prmShape">
            <option value="rect">矩形</option>
            <option value="stepped">雁行</option>
            <option value="L">L字</option>
            <option value="setback">セットバック</option>
          </select>
        </label>
        <label>階数
          <select id="prmFloors">
            <option value="2">2階</option>
            <option value="3" selected>3階</option>
            <option value="4">4階</option>
          </select>
        </label>
        <label>構造
          <select id="prmFrame">
            <option value="S" selected>S造</option>
            <option value="RC">RC造</option>
            <option value="SRC">SRC造</option>
          </select>
        </label>
        <label>躯体工法
          <select id="prmMethod">
            <option value="conv">在来</option>
            <option value="pca">PCa</option>
          </select>
        </label>
      </div>
      <div class="prow">
        <span class="summary" id="prmSummary">この物件：—</span>
      </div>
      <div class="prule" id="prmRule"></div>
    </div>

    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div id="bubLayer"></div>
      <div class="caller-chip" id="callerChip"><span class="av" id="callerAv">？</span><span id="callerName">—</span></div>
      <div class="hint" id="hint">工区をタップすると、その場所の様子が見られます</div>
      <div class="card" id="card">
        <button class="close" id="cardClose" aria-label="閉じる">×</button>
        <h2 id="cardTitle">—</h2>
        <div class="work" id="cardWork">—</div>
        <div class="foreman" id="cardForeman">
          <div class="avatar" id="cardAvatar">？</div>
          <div>
            <div class="who" id="cardWho">—</div>
            <div class="tag" id="cardTag">—</div>
          </div>
        </div>
        <div class="row"><span>作業員</span><b id="cardCrew">—</b></div>
        <div class="pbar"><div class="pf" id="cardPlan"></div><div class="af" id="cardAct"></div></div>
        <div class="row"><span>進捗（実績 / 計画）</span><b id="cardPct">—</b></div>
        <div class="row"><span>状態</span><b id="cardState">—</b></div>
        <div class="row" id="rowGate"><span>検査ゲート</span><b id="cntGate">—</b></div>
        <div class="row" id="rowSteel"><span id="lblSteel">躯体（柱・梁・床版・配筋）</span><b id="cntSteel">—</b></div>
        <div class="row" id="rowExt"><span>外装パネル・サッシ（全4面）</span><b id="cntExt">—</b></div>
        <div class="row" id="rowScaf"><span>足場（組立 / 解体）</span><b id="cntScaf">—</b></div>
        <div class="row" id="rowEquip"><span>設備 3系統（先行/隠蔽/器具）</span><b id="cntEquip">—</b></div>
        <div class="row" id="rowInt"><span>内装（ボード・床）</span><b id="cntInt">—</b></div>
        <div class="row" id="rowRoofEq"><span>屋上設備（室外機・受電）</span><b id="cntRoofEq">—</b></div>
        <div class="row" id="rowEV"><span>エレベーター</span><b id="cntEV">—</b></div>
      </div>
      <div class="event-cap" id="eventCap"></div>
      <div class="note">検証用プロトタイプ — 物件パラメータ（敷地・形状・階数・構造・工法）で現場が再生成される</div>
    </div>

    <div class="controls">
      <div class="ctl-row">
        <button class="btn primary" id="playBtn" aria-label="再生・停止">
          <svg id="playIco" width="15" height="15" viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z" fill="currentColor"/></svg>
        </button>
        <button class="btn" id="restartBtn" aria-label="最初から">
          <svg width="15" height="15" viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 1-5.66 4H.7A7.5 7.5 0 1 0 8 .5v3L3.6 0 8 3.5z" fill="currentColor" transform="translate(0.5,0.5) scale(0.94)"/></svg>
        </button>
        <input type="range" id="slider" min="0" max="600" value="0" step="1" aria-label="日数スライダー" />
        <button class="btn" id="speedBtn">×1</button>
        <button class="btn" id="ghostBtn" aria-pressed="true">ゴースト表示</button>
      </div>
      <div class="ctl-row wrap">
        <span class="flabel">階フォーカス</span>
        <span id="focusBtns" style="display:inline-flex;gap:10px;flex-wrap:wrap"></span>
        <button class="btn fbtn" id="roofBtn" aria-pressed="false">屋根：自動</button>
        <span class="flabel">視点</span>
        <button class="btn fbtn" id="rotBtn">回転：南東から</button>
        <button class="btn fbtn" id="bubBtn" aria-pressed="true">会話：ON</button>
        <span class="fstatus" id="focusStatus"></span>
      </div>
      <div class="legend" id="legend"></div>
    </div>

    <script>
    'use strict';
    /* =========================================================
       アイソメ2.5D現場ビュー 検証試作（パラメータ対応版）
       物件パラメータ（敷地形状／建物形状／階数／構造／躯体工法）を変えると
       現場が再生成される。躯体のステージ構成と部材の生まれ方は
       構造×工法の「工程テンプレート」で切り替わる：
         S×在来 ＝ 節建方→本締め確認→デッキ→配筋→打設
         RC×在来 ＝ 型枠→配筋→配筋検査→打設→養生→脱型（転用）→強度確認
         SRC×在来 ＝ Sの建方の後に型枠・配筋・打設が回る二重構造
         RC/SRC×PCa ＝ 完成部材を吊り込み、接合で繋ぐ（製品検査・接合確認）
       進捗は「部材の設置イベント」で離散的に進み、計画ゴーストで遅れが見える。
       ========================================================= */

    var TRADES = {
      earth:    { name: '土工',   color: '#9a6a3f', dark: '#6f4a29' },
      found:    { name: '基礎',   color: '#a89e90', dark: '#7d7466' },
      steel:    { name: '鉄骨',   color: '#b06a44', dark: '#7e4a2a' },
      frame:    { name: '躯体',   color: '#8d8578', dark: '#655d4f' },
      elec:     { name: '電気',   color: '#f2c230', dark: '#b8911c' },
      plumb:    { name: '衛生',   color: '#3a7bd5', dark: '#2a5ca3' },
      hvac:     { name: '空調',   color: '#7ec8e3', dark: '#4d97b5' },
      interior: { name: '内装',   color: '#ef8354', dark: '#c25c2e' },
      exterior: { name: '外装',   color: '#5da85f', dark: '#3f7a41' },
      scaffold: { name: '鳶',     color: '#8593a0', dark: '#5b6a76' },
      roof:     { name: '屋根',   color: '#707a88', dark: '#4c545f' },
      insp:     { name: '検査',   color: '#37474f', dark: '#263238' },
      ev:       { name: 'EV',     color: '#6e7a87', dark: '#49525c' }
    };

    var FOREMEN = {
      earth:    { name: '大山', tag: '重機の段取りが速い。朝が強い' },
      found:    { name: '大山', tag: '重機の段取りが速い。朝が強い' },
      steel:    { name: '佐藤', tag: '腕は確かだが段取りは粗い' },
      frame:    { name: '佐藤', tag: '型枠と鉄筋の段取りを束ねる躯体職長' },
      elec:     { name: '鈴木', tag: '気になる点はすぐ聞きに来る' },
      plumb:    { name: '高橋', tag: '寡黙。隠蔽部の写真は完璧' },
      hvac:     { name: '伊藤', tag: '調整ごとが得意なまとめ役' },
      interior: { name: '田中', tag: '仕上げにうるさい職人気質' },
      exterior: { name: '山本', tag: '天気を読むのが異常に上手い' },
      scaffold: { name: '藤田', tag: '鳶の頭。足場の段取りと安全に厳しい' },
      roof:     { name: '山本', tag: '天気を読むのが異常に上手い' },
      insp:     { name: '田辺', tag: '監理者。見る前に隠すな、が口癖' },
      ev:       { name: '西村', tag: 'EV専門。単独ラインで黙々と進める' }
    };
    var SUPERVISOR = { name: '担当者', tag: '現場担当（監督）。巡回と段取りが仕事' };
    var MANAGER = { name: '課長', tag: '工程と原価を見る。事務所と現場を行き来する' };
    var INSPECTOR = { name: '田辺', tag: '監理者。検査の立会い・判定をする' };

    /* ---------- 物件パラメータ ---------- */
    var PARAMS = { site: 'rect', shape: 'rect', floors: 3, frame: 'S', method: 'conv' };
    var SITE_LABEL = { rect: '矩形', trap: '台形', L: 'L字敷地' };
    var SHAPE_LABEL = { rect: '矩形', stepped: '雁行', L: 'L字', setback: 'セットバック' };
    var FLOORS = 3;          // 派生：PARAMS.floors
    var TOTAL_DAYS = 60;     // 再生成のたびに実スケジュールから決まる
    var EST_DAYS = 61;       // 天候ウィンドウ配置用の概算工期

    /* ---------- 工程モデル（計画 / 実績） ---------- */
    function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
    function prog(t, s, e) {
      var p = clamp01((t - s) / (e - s));
      return p * p * (3 - 2 * p);
    }
    function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
    function lagJitter(seed) { return hash(seed) * 1.6; }
    function mkStage(trade, work, ps, dur, crew, seed) {
      var lag = lagJitter(seed || 1);
      return {
        trade: trade, work: work, crew: crew,
        ps: ps, pe: ps + dur,
        as: ps + lag, ae: ps + dur + lag + dur * 0.05
      };
    }
    function mkStageAbs(trade, work, ps, pe, as, ae, crew) {
      return { trade: trade, work: work, crew: crew, ps: ps, pe: pe, as: as, ae: ae };
    }

    var ZONE_NAMES = ['西', '中', '東'];
    var POWER_PLAN = 45.5, POWER_ACT = 46.5;
    var units = [];        // プレート（セル集合）に存在する工区だけを作る
    var UNITMAP = {};      // (f*3+z) -> unit
    function U(f, z) { return UNITMAP[f * 3 + z] || null; }
    var EARTH = null, FOUND = null;
    var MOBILE_CRANE_DAYS = [2, 4, 6, 8, 9];
    var RAIN = { from: 18, to: 21 };
    var RAIN2 = { from: 40, to: 41.2 };
    var WIND = { from: 26.6, to: 27.4 };
    var BACKFILL = { from: 12, to: 16.5 };
    var WASTE_DAYS = [20, 33, 46, 55];
    var LAYER_GATES = [];
    var EVST = null;
    var EVSHAFT = null;

    /* プレート：階ごとに存在する工区（z の集合）を返す。中央工区 z=1 は
       EVシャフトと吹抜けのために全形状・全階で必ず存在させる */
    function plateZones(f) {
      if (f === 0) return [0, 1, 2];
      switch (PARAMS.shape) {
        case 'stepped': return f === FLOORS - 1 ? [0, 1] : [0, 1, 2];
        case 'L': return [0, 1];
        case 'setback': return f === FLOORS - 1 ? [1, 2] : (FLOORS >= 4 && f === FLOORS - 2 ? [1, 2] : [0, 1, 2]);
        default: return [0, 1, 2];
      }
    }
    function isTopFloor(f) { return f === FLOORS - 1; }

    /* =========================================================
       部材モデル：進捗は「部材の設置イベント」で離散的に進む
       ========================================================= */
    var FH = 30; // 階高（描画側の FLOOR_H と同じ値）
    function setTimes(st, it, frac) {
      it.plan = st.ps + frac * (st.pe - st.ps);
      var ae = Math.min(st.ae, 999);
      it.act = st.as + frac * (ae - st.as);
      return it;
    }
    function setAbs(it, planT, actT) { it.plan = planT; it.act = actT; return it; }
    function spreadInto(st, items, a, b) {
      for (var i = 0; i < items.length; i++)
        setTimes(st, items[i], a + (b - a) * (i + 0.5) / items.length);
    }
    function shiftStageActs(st, d) {
      if (!st) return;
      st.as += d; st.ae += d;
      if (!st.items) return;
      for (var i = 0; i < st.items.length; i++) {
        var it = st.items[i];
        it.act += d;
        if (it.aStart != null) it.aStart += d;
        if (it.rmvA != null) it.rmvA += d;
      }
    }
    function shiftUnitFrame(u, dP, dA) {
      var st = u.stages.steel;
      if (dP > 0) {
        st.ps += dP; st.pe += dP;
        for (var j = 0; j < st.items.length; j++) {
          st.items[j].plan += dP;
          if (st.items[j].pStart != null) st.items[j].pStart += dP;
        }
        for (var k in u.gates) if (u.gates[k]) u.gates[k].plan += dP;
        u.curePlan += dP;
      }
      if (dA > 0) {
        shiftStageActs(st, dA);
        for (var k2 in u.gates) if (u.gates[k2]) u.gates[k2].act += dA;
        u.cureAct += dA;
      }
    }

    /* ---------- 基礎：フーチング＋地中梁＋土間 ---------- */
    function buildFoundation() {
      var st = mkStage('found', '基礎（フーチング・地中梁）', 5, 7, 6, 23);
      var items = [], i, j;
      var xs = [4.5, 6, 7.5, 9, 10.5, 12, 13.5], ys = [3.5, 6.5, 9.5];
      for (i = 0; i < xs.length; i++) for (j = 0; j < ys.length; j++)
        items.push({ k: 'foot', x0: xs[i] - 0.42, y0: ys[j] - 0.42, x1: xs[i] + 0.42, y1: ys[j] + 0.42,
          dz0: 0, dz1: 3.2, sp: [[xs[i], ys[j], 3.2]] });
      var beams = [];
      for (j = 0; j < ys.length; j++)
        beams.push({ k: 'gbeam', x0: 4.5, y0: ys[j] - 0.22, x1: 13.5, y1: ys[j] + 0.22, dz0: 0.6, dz1: 2.6, sp: [[9, ys[j], 2.6]] });
      for (i = 0; i < xs.length; i++)
        beams.push({ k: 'gbeam', x0: xs[i] - 0.22, y0: 3.5, x1: xs[i] + 0.22, y1: 9.5, dz0: 0.6, dz1: 2.6, sp: [[xs[i], 6.5, 2.6]] });
      var slabs = [];
      for (i = 0; i < 3; i++)
        slabs.push({ k: 'fslab', x0: 4.5 + i * 3, y0: 3.5, x1: 7.5 + i * 3, y1: 9.5, dz0: 2.6, dz1: 6, sp: [[6 + i * 3, 6.5, 6]] });
      spreadInto(st, items, 0.04, 0.46);
      spreadInto(st, beams, 0.48, 0.78);
      spreadInto(st, slabs, 0.82, 0.97);
      st.items = items.concat(beams, slabs);
      FOUND = st;
    }

    /* =========================================================
       躯体テンプレート：構造×工法でステージ構成と部材の生まれ方が変わる。
       どのテンプレートも「結果としてその階の床が出来る」点は共通で、
       後段（設備・内装・屋根）は床の完成（floorState）を前提に進む。
       ========================================================= */
    function colPositions(u) {
      var zx = 4.5 + u.z * 3, xm = zx + 1.5, xe = zx + 3, y0 = 3.5, y1 = 9.5;
      return { zx: zx, xm: xm, xe: xe, y0: y0, y1: y1,
        pos: [[zx, y0], [xe, y0], [xm, y0], [zx, y1], [xe, y1], [xm, y1]] };
    }
    function beamDefs(g) {
      return [
        [g.zx, g.y0 - 0.15, g.xe, g.y0 + 0.15, g.zx, g.y0, g.xe, g.y0],
        [g.zx, g.y1 - 0.15, g.xe, g.y1 + 0.15, g.zx, g.y1, g.xe, g.y1],
        [g.zx - 0.15, g.y0, g.zx + 0.15, g.y1, g.zx, g.y0, g.zx, g.y1],
        [g.xe - 0.15, g.y0, g.xe + 0.15, g.y1, g.xe, g.y0, g.xe, g.y1],
        [g.xm - 0.15, g.y0, g.xm + 0.15, g.y1, g.xm, g.y0, g.xm, g.y1]
      ];
    }
    function makePour(u, st, gatePlan, gateAct) {
      var g = colPositions(u);
      var pour = { k: 'pour', trucks: 4, sp: [[g.xm, 6.5, FH]] };
      pour.pStart = gatePlan + 0.1;
      pour.plan = pour.pStart + 1.1;
      pour.aStart = gateAct + 0.1;
      pour.act = pour.aStart + 1.1;
      return pour;
    }
    function finishPourStage(u, st, pour) {
      st.items.push(pour);
      st.pe = pour.plan + 0.2;
      st.ae = pour.act + 0.2;
      u.curePlan = pour.plan + 2.0;
      u.cureAct = pour.act + 2.5;
    }
    function maxItemTime(items, key) {
      var m = 0;
      for (var i = 0; i < items.length; i++) if (items[i][key] > m) m = items[i][key];
      return m;
    }

    /* ---------- S×在来：節単位の建方→本締め・建入れ確認→デッキ→配筋→打設 ---------- */
    function buildFrameSteel(u) {
      var g = colPositions(u);
      var steelStart = 10 + u.f * 6 + u.z * 2;
      var st = mkStage('steel', '鉄骨建方・本締め・配筋・スラブ', steelStart, 8, 6, 31 + u.f * 7 + u.z * 13);
      var cols = [], beams = [], sbeams = [], braces = [], plates = [], rebars = [], i;
      if (u.f % 2 === 0) { // 節：柱は最大2層分を通して立てる（下の節が担当する階では立てない）
        var spanFloors = Math.min(2, FLOORS - u.f);
        var colTop = spanFloors * FH - 3;
        for (i = 0; i < g.pos.length; i++) {
          var c = g.pos[i];
          cols.push({ k: 'col', x0: c[0] - 0.17, y0: c[1] - 0.17, x1: c[0] + 0.17, y1: c[1] + 0.17,
            dz0: 0, dz1: colTop, tall: spanFloors > 1, sp: [[c[0], c[1], 1]] });
        }
      }
      var bd = beamDefs(g);
      for (i = 0; i < bd.length; i++) {
        var b = bd[i];
        beams.push({ k: 'beam', x0: b[0], y0: b[1], x1: b[2], y1: b[3], dz0: FH - 6, dz1: FH - 3.2,
          sp: [[b[4], b[5], FH - 3], [b[6], b[7], FH - 3]] });
      }
      for (i = 0; i < 2; i++) {
        var sx = g.zx + 0.75 + i * 1.5;
        sbeams.push({ k: 'sbeam', x0: sx - 0.09, y0: g.y0, x1: sx + 0.09, y1: g.y1, dz0: FH - 5.4, dz1: FH - 3.4,
          sp: [[sx, 6.5, FH - 3.4]] });
      }
      braces.push({ k: 'brace', x0: g.zx, y0: g.y0, x1: g.xm, y1: g.y0, dz0: 2, dz1: FH - 4, sp: [[g.zx + 0.7, g.y0, FH / 2]] });
      braces.push({ k: 'brace', x0: g.xe, y0: g.y1, x1: g.xm, y1: g.y1, dz0: 2, dz1: FH - 4, sp: [[g.xe - 0.7, g.y1, FH / 2]] });
      if (!u.atrium) {
        for (var ix = 0; ix < 2; ix++) for (var iy = 0; iy < 3; iy++) {
          plates.push({ k: 'plate', x0: g.zx + ix * 1.5, y0: g.y0 + iy * 2, x1: g.zx + ix * 1.5 + 1.5, y1: g.y0 + iy * 2 + 2,
            dz0: FH - 2.6, dz1: FH, sp: [[g.zx + ix * 1.5 + 0.75, g.y0 + iy * 2 + 1, FH]] });
          rebars.push({ k: 'rebar', x0: g.zx + ix * 1.5 + 0.06, y0: g.y0 + iy * 2 + 0.06, x1: g.zx + ix * 1.5 + 1.44, y1: g.y0 + iy * 2 + 1.94,
            dz0: FH, dz1: FH + 0.4, sp: [[g.zx + ix * 1.5 + 0.75, g.y0 + iy * 2 + 1, FH + 0.4]] });
        }
      }
      spreadInto(st, cols, 0.02, 0.26);
      spreadInto(st, beams, 0.33, 0.50);
      spreadInto(st, sbeams, 0.50, 0.58);
      spreadInto(st, braces, 0.56, 0.62);
      // 本締め・建入れ直し確認：梁・小梁・ブレースが揃ってから判定し、合格までデッキは始まらない
      var frameParts = cols.concat(beams, sbeams, braces);
      var tgP = maxItemTime(frameParts, 'plan'), tgA = maxItemTime(frameParts, 'act');
      u.gates.frame = { kind: 'torque', label: '本締め・建入れ確認', plan: tgP + 0.1, act: tgA + 0.1, dur: 0.4 };
      // デッキ以降の開始をゲート合格の後ろへ寄せる
      spreadInto(st, plates, 0.60, 0.72);
      var di;
      for (di = 0; di < plates.length; di++) {
        if (plates[di].plan < tgP + 0.55) plates[di].plan = tgP + 0.55 + di * 0.06;
        if (plates[di].act < tgA + 0.55) plates[di].act = tgA + 0.55 + di * 0.06;
      }
      spreadInto(st, rebars, 0.74, 0.85);
      for (di = 0; di < rebars.length; di++) {
        if (rebars[di].plan < tgP + 0.8) rebars[di].plan = tgP + 0.8 + di * 0.05;
        if (rebars[di].act < tgA + 0.8) rebars[di].act = tgA + 0.8 + di * 0.05;
      }
      var all = cols.concat(beams, sbeams, braces, plates, rebars);
      if (!u.atrium) {
        var rbP = maxItemTime(rebars, 'plan'), rbA = maxItemTime(rebars, 'act');
        var pour = makePour(u, st, rbP + 0.15, rbA + 0.15);
        st.items = all.concat([pour]);
        st.pe = pour.plan + 0.2;
        st.ae = pour.act + 0.2;
        u.curePlan = pour.plan + 2.0;
        u.cureAct = pour.act + 2.5;
      } else {
        st.items = all;
        u.curePlan = st.pe; u.cureAct = st.ae;
      }
      u.stages.steel = st;
    }

    /* ---------- RC×在来：型枠→配筋→配筋検査→打設→養生→脱型（転用）→強度確認 ----------
       柱・梁・床は打設で初めて実体化する（conc 部材は打設時刻に生まれる）。
       型枠は rmvA（脱型）で消え、次の工区の材料になる。クレーンは資材揚重のみ。 */
    function buildFrameRC(u) {
      var g = colPositions(u);
      var start = 10 + u.f * 6 + u.z * 2;
      var st = mkStage('frame', '躯体（型枠・配筋・打設）', start, 9, 7, 31 + u.f * 7 + u.z * 13);
      var forms = [], cages = [], rebars = [], concs = [], i;
      for (i = 0; i < g.pos.length; i++) {
        var c = g.pos[i];
        forms.push({ k: 'form', x0: c[0] - 0.30, y0: c[1] - 0.30, x1: c[0] + 0.30, y1: c[1] + 0.30,
          dz0: 0, dz1: FH - 3.4, sp: [[c[0], c[1], FH - 4]] });
        cages.push({ k: 'cage', x0: c[0] - 0.20, y0: c[1] - 0.20, x1: c[0] + 0.20, y1: c[1] + 0.20,
          dz0: 0.4, dz1: FH - 3.8, sp: [[c[0], c[1], FH / 2]] });
        concs.push({ k: 'conc', x0: c[0] - 0.26, y0: c[1] - 0.26, x1: c[0] + 0.26, y1: c[1] + 0.26,
          dz0: 0, dz1: FH - 3.2, bornAtPour: true, sp: [[c[0], c[1], 1]] });
      }
      var bd = beamDefs(g);
      for (i = 0; i < bd.length; i++) {
        var b = bd[i];
        forms.push({ k: 'form', x0: b[0] - 0.06, y0: b[1] - 0.06, x1: b[2] + 0.06, y1: b[3] + 0.06,
          dz0: FH - 6.6, dz1: FH - 3.0, sp: [[b[4], b[5], FH - 3]] });
        concs.push({ k: 'conc', x0: b[0], y0: b[1], x1: b[2], y1: b[3], dz0: FH - 6, dz1: FH - 3.2,
          bornAtPour: true, sp: [[b[4], b[5], FH - 3]] });
      }
      if (!u.atrium) {
        for (var ix = 0; ix < 2; ix++) for (var iy = 0; iy < 3; iy++) {
          rebars.push({ k: 'rebar', x0: g.zx + ix * 1.5 + 0.06, y0: g.y0 + iy * 2 + 0.06, x1: g.zx + ix * 1.5 + 1.44, y1: g.y0 + iy * 2 + 1.94,
            dz0: FH - 2.2, dz1: FH - 1.8, sp: [[g.zx + ix * 1.5 + 0.75, g.y0 + iy * 2 + 1, FH - 1.8]] });
          forms.push({ k: 'form', x0: g.zx + ix * 1.5, y0: g.y0 + iy * 2, x1: g.zx + ix * 1.5 + 1.5, y1: g.y0 + iy * 2 + 2,
            dz0: FH - 2.9, dz1: FH - 2.55, sp: [] });
        }
      }
      spreadInto(st, forms, 0.03, 0.34);   // 型枠：材料の山から一枚ずつ建て込み
      spreadInto(st, cages, 0.30, 0.55);   // 柱配筋：束から一本ずつ組み上げ
      spreadInto(st, rebars, 0.52, 0.72);  // 床配筋
      var all = forms.concat(cages, rebars);
      if (!u.atrium) {
        var rbAll = cages.concat(rebars);
        var rbP = maxItemTime(rbAll, 'plan'), rbA = maxItemTime(rbAll, 'act');
        u.gates.rebar = { kind: 'rebar', label: '配筋検査', plan: rbP + 0.15, act: rbA + 0.15, dur: 0.45 };
        var pour = makePour(u, st, rbP + 0.6, rbA + 0.6);
        // コンクリート部材は打設で初めて実体化する
        for (i = 0; i < concs.length; i++) setAbs(concs[i], pour.pStart + 0.05, pour.aStart + 0.05);
        all = all.concat(concs);
        st.items = all;
        finishPourStage(u, st, pour);
        st.items = all.concat([pour]);
        // 脱型：養生が明けたら型枠は外れて次の工区へ転用される
        for (i = 0; i < forms.length; i++) {
          forms[i].rmvP = u.curePlan + 0.4 + (i % 4) * 0.15;
          forms[i].rmvA = u.cureAct + 0.4 + (i % 4) * 0.15;
        }
        // 強度確認：材齢が来てから判定。合格するまで上の階の躯体は始められない
        u.gates.strength = { kind: 'strength', label: '強度確認（材齢）',
          plan: u.curePlan + 0.6, act: u.cureAct + 0.6, dur: 0.5 };
      } else {
        st.items = all;
        u.curePlan = st.pe; u.cureAct = st.ae;
      }
      u.stages.steel = st;
    }

    /* ---------- SRC×在来：Sの建方の後に、型枠・配筋・打設が回る二重構造 ---------- */
    function buildFrameSRC(u) {
      var g = colPositions(u);
      var start = 10 + u.f * 6 + u.z * 2;
      var st = mkStage('steel', '鉄骨建方＋RC巻き（SRC）', start, 11, 7, 31 + u.f * 7 + u.z * 13);
      var cols = [], beams = [], forms = [], cages = [], rebars = [], concs = [], i;
      if (u.f % 2 === 0) {
        var spanFloors = Math.min(2, FLOORS - u.f);
        var colTop = spanFloors * FH - 3;
        for (i = 0; i < g.pos.length; i++) {
          var c = g.pos[i];
          cols.push({ k: 'col', x0: c[0] - 0.15, y0: c[1] - 0.15, x1: c[0] + 0.15, y1: c[1] + 0.15,
            dz0: 0, dz1: colTop, tall: spanFloors > 1, sp: [[c[0], c[1], 1]] });
        }
      }
      var bd = beamDefs(g);
      for (i = 0; i < bd.length; i++) {
        var b = bd[i];
        beams.push({ k: 'beam', x0: b[0], y0: b[1], x1: b[2], y1: b[3], dz0: FH - 6, dz1: FH - 3.2,
          sp: [[b[4], b[5], FH - 3], [b[6], b[7], FH - 3]] });
      }
      // 鉄骨の周りに型枠を組み、配筋してコンクリートを巻く
      for (i = 0; i < g.pos.length; i++) {
        var c2 = g.pos[i];
        forms.push({ k: 'form', x0: c2[0] - 0.32, y0: c2[1] - 0.32, x1: c2[0] + 0.32, y1: c2[1] + 0.32,
          dz0: 0, dz1: FH - 3.4, sp: [[c2[0], c2[1], FH - 4]] });
        cages.push({ k: 'cage', x0: c2[0] - 0.24, y0: c2[1] - 0.24, x1: c2[0] + 0.24, y1: c2[1] + 0.24,
          dz0: 0.4, dz1: FH - 3.8, sp: [[c2[0], c2[1], FH / 2]] });
        concs.push({ k: 'conc', x0: c2[0] - 0.28, y0: c2[1] - 0.28, x1: c2[0] + 0.28, y1: c2[1] + 0.28,
          dz0: 0, dz1: FH - 3.2, bornAtPour: true, sp: [[c2[0], c2[1], 1]] });
      }
      if (!u.atrium) {
        for (var ix = 0; ix < 2; ix++) for (var iy = 0; iy < 3; iy++) {
          rebars.push({ k: 'rebar', x0: g.zx + ix * 1.5 + 0.06, y0: g.y0 + iy * 2 + 0.06, x1: g.zx + ix * 1.5 + 1.44, y1: g.y0 + iy * 2 + 1.94,
            dz0: FH - 2.2, dz1: FH - 1.8, sp: [[g.zx + ix * 1.5 + 0.75, g.y0 + iy * 2 + 1, FH - 1.8]] });
          forms.push({ k: 'form', x0: g.zx + ix * 1.5, y0: g.y0 + iy * 2, x1: g.zx + ix * 1.5 + 1.5, y1: g.y0 + iy * 2 + 2,
            dz0: FH - 2.9, dz1: FH - 2.55, sp: [] });
        }
      }
      spreadInto(st, cols, 0.02, 0.20);
      spreadInto(st, beams, 0.24, 0.38);
      var steelParts = cols.concat(beams);
      var tgP = maxItemTime(steelParts, 'plan'), tgA = maxItemTime(steelParts, 'act');
      u.gates.frame = { kind: 'torque', label: '本締め・建入れ確認', plan: tgP + 0.1, act: tgA + 0.1, dur: 0.4 };
      spreadInto(st, forms, 0.42, 0.60);
      spreadInto(st, cages, 0.55, 0.70);
      spreadInto(st, rebars, 0.66, 0.80);
      var all = cols.concat(beams, forms, cages, rebars);
      if (!u.atrium) {
        var rbAll = cages.concat(rebars);
        var rbP = maxItemTime(rbAll, 'plan'), rbA = maxItemTime(rbAll, 'act');
        u.gates.rebar = { kind: 'rebar', label: '配筋検査', plan: rbP + 0.15, act: rbA + 0.15, dur: 0.45 };
        var pour = makePour(u, st, rbP + 0.6, rbA + 0.6);
        for (i = 0; i < concs.length; i++) setAbs(concs[i], pour.pStart + 0.05, pour.aStart + 0.05);
        all = all.concat(concs);
        st.items = all;
        finishPourStage(u, st, pour);
        st.items = all.concat([pour]);
        for (i = 0; i < forms.length; i++) {
          forms[i].rmvP = u.curePlan + 0.4 + (i % 4) * 0.15;
          forms[i].rmvA = u.cureAct + 0.4 + (i % 4) * 0.15;
        }
        u.gates.strength = { kind: 'strength', label: '強度確認（材齢）',
          plan: u.curePlan + 0.6, act: u.cureAct + 0.6, dur: 0.5 };
      } else {
        st.items = all;
        u.curePlan = st.pe; u.cureAct = st.ae;
      }
      u.stages.steel = st;
    }

    /* ---------- RC/SRC×PCa：完成部材が届いて吊り込まれ、接合で繋がる ----------
       型枠・現場配筋・打設は消える。現場加工の束は出ない。
       ゲートは製品検査（工場出荷・受入）と接合確認（目地・グラウト）。 */
    function buildFramePCa(u) {
      var g = colPositions(u);
      var start = 10 + u.f * 6 + u.z * 2;
      var st = mkStage('frame', 'PCa建方（吊り込み・接合）', start, 6.5, 5, 31 + u.f * 7 + u.z * 13);
      var cols = [], beams = [], slabs = [], joints = [], i;
      if (u.f % 2 === 0) {
        var spanFloors = Math.min(2, FLOORS - u.f);
        var colTop = spanFloors * FH - 3;
        for (i = 0; i < g.pos.length; i++) {
          var c = g.pos[i];
          cols.push({ k: 'pccol', x0: c[0] - 0.24, y0: c[1] - 0.24, x1: c[0] + 0.24, y1: c[1] + 0.24,
            dz0: 0, dz1: colTop, tall: spanFloors > 1, sp: [[c[0], c[1], 1]] });
        }
      }
      var bd = beamDefs(g);
      for (i = 0; i < bd.length; i++) {
        var b = bd[i];
        beams.push({ k: 'pcbeam', x0: b[0], y0: b[1], x1: b[2], y1: b[3], dz0: FH - 6, dz1: FH - 3.2,
          sp: [[b[4], b[5], FH - 3], [b[6], b[7], FH - 3]] });
      }
      if (!u.atrium) {
        for (var ix = 0; ix < 2; ix++) for (var iy = 0; iy < 3; iy++)
          slabs.push({ k: 'pcslab', x0: g.zx + ix * 1.5 + 0.03, y0: g.y0 + iy * 2 + 0.03, x1: g.zx + ix * 1.5 + 1.47, y1: g.y0 + iy * 2 + 1.97,
            dz0: FH - 2.6, dz1: FH, sp: [[g.zx + ix * 1.5 + 0.75, g.y0 + iy * 2 + 1, FH]] });
      }
      // 接合部（目地・グラウト）：部材同士の繋ぎ目に小さな接合イベントが立つ
      for (i = 0; i < g.pos.length; i++) {
        var cp = g.pos[i];
        joints.push({ k: 'joint', x0: cp[0] - 0.30, y0: cp[1] - 0.30, x1: cp[0] + 0.30, y1: cp[1] + 0.30,
          dz0: FH - 6.4, dz1: FH - 5.6, sp: [[cp[0], cp[1], FH - 5.6]] });
      }
      // 製品検査：最初の部材が吊り込まれる前に、受入検査で一度止まる
      u.gates.frame = { kind: 'product', label: '製品検査（PCa受入）',
        plan: st.ps + 0.1, act: st.as + 0.1, dur: 0.4 };
      spreadInto(st, cols, 0.10, 0.34);
      spreadInto(st, beams, 0.38, 0.58);
      spreadInto(st, slabs, 0.60, 0.82);
      spreadInto(st, joints, 0.84, 0.97);
      st.items = cols.concat(beams, slabs, joints);
      var jP = maxItemTime(joints, 'plan'), jA = maxItemTime(joints, 'act');
      if (!u.atrium) {
        u.gates.joint = { kind: 'joint', label: '接合確認（目地・グラウト）', plan: jP + 0.1, act: jA + 0.1, dur: 0.4 };
        u.curePlan = jP + 0.5;
        u.cureAct = jA + 0.5;
      } else {
        u.curePlan = st.pe; u.cureAct = st.ae;
      }
      u.stages.steel = st;
    }

    function buildFrame(u) {
      if (PARAMS.method === 'pca') buildFramePCa(u);
      else if (PARAMS.frame === 'RC') buildFrameRC(u);
      else if (PARAMS.frame === 'SRC') buildFrameSRC(u);
      else buildFrameSteel(u);
    }

    /* ---------- 外部足場（鳶）：建物を回り込む4面に、外装より大きく先行して組む ---------- */
    function buildScaffold(u) {
      var steelStart = 10 + u.f * 6 + u.z * 2;
      var extPs = steelStart + 9 + u.z;
      var st = mkStageAbs('scaffold', '外部足場 組立（鳶）',
        extPs - 4.2, extPs - 1.6, extPs - 4.2 + lagJitter(41 + u.f * 3 + u.z), extPs - 1.6 + lagJitter(41 + u.f * 3 + u.z) + 0.2, 5);
      var zx = 4.5 + u.z * 3, xe = zx + 3, y0 = 3.5, y1 = 9.5;
      var frames = [], r, c;
      for (r = 0; r < 2; r++) { // 面の並び（E,S,N,W）は外装パネルと対応させる
        for (c = 0; c < 3; c++) frames.push({ k: 'scaf', face: 'E', r: r, c: c,
          x0: xe, y0: y0 + c * 2, x1: xe, y1: y0 + c * 2 + 2, dz0: r * 15, dz1: r * 15 + 15, sp: [] });
        for (c = 0; c < 3; c++) frames.push({ k: 'scaf', face: 'S', r: r, c: c,
          x0: zx + c, y0: y1, x1: zx + c + 1, y1: y1, dz0: r * 15, dz1: r * 15 + 15, sp: [] });
        for (c = 0; c < 3; c++) frames.push({ k: 'scaf', face: 'N', r: r, c: c,
          x0: zx + c, y0: y0, x1: zx + c + 1, y1: y0, dz0: r * 15, dz1: r * 15 + 15, sp: [] });
        for (c = 0; c < 3; c++) frames.push({ k: 'scaf', face: 'W', r: r, c: c,
          x0: zx, y0: y0 + c * 2, x1: zx, y1: y0 + c * 2 + 2, dz0: r * 15, dz1: r * 15 + 15, sp: [] });
      }
      spreadInto(st, frames, 0.03, 0.97);
      var extPe = extPs + 8, extAe = extPe + lagJitter(53 + u.f * 5 + u.z * 3) + 0.4;
      var dP = extPe + 0.3, dA = extAe + 0.3, dDur = 1.8;
      var order = frames.slice().sort(function (a, b) { return (b.r - a.r) || (a.c - b.c); });
      for (var i = 0; i < order.length; i++) {
        var fr = (i + 0.5) / order.length;
        order[i].rmvP = dP + fr * dDur;
        order[i].rmvA = dA + fr * dDur;
      }
      st.items = frames;
      u.scaffold = st;
      u.scaffoldOut = { trade: 'scaffold', work: '足場バラし（解体）・資材返却', crew: 4,
        ps: dP, pe: dP + dDur, as: dA, ae: dA + dDur };
    }

    /* ---------- 外装：全4面（東・南・北・西）にパネル・サッシ・シーリングが存在する。
       どの視点から見ても、その方向から見える2面の外装が描かれる ---------- */
    function buildExterior(u) {
      var steelStart = 10 + u.f * 6 + u.z * 2;
      var st = mkStage('exterior', '外装（ALC・シーリング）', steelStart + 9 + u.z, 8, 5, 53 + u.f * 5 + u.z * 3);
      var zx = 4.5 + u.z * 3, xe = zx + 3, y0 = 3.5, y1 = 9.5;
      var items = [];
      for (var r = 0; r < 2; r++) {
        var c;
        for (c = 0; c < 3; c++) items.push({ k: 'panel', face: 'E', glass: (c + r) % 2 === 1,
          x0: xe, y0: y0 + c * 2, x1: xe + 0.18, y1: y0 + c * 2 + 2, dz0: r * 15, dz1: r * 15 + 15,
          sp: [[xe + 0.2, y0 + c * 2 + 1, r * 15 + 7]] });
        for (c = 0; c < 3; c++) items.push({ k: 'panel', face: 'S', glass: (c + r) % 2 === 0,
          x0: zx + c, y0: y1, x1: zx + c + 1, y1: y1 + 0.18, dz0: r * 15, dz1: r * 15 + 15,
          sp: [[zx + c + 0.5, y1 + 0.2, r * 15 + 7]] });
        for (c = 0; c < 3; c++) items.push({ k: 'panel', face: 'N', glass: (c + r + 1) % 2 === 0,
          x0: zx + c, y0: y0 - 0.18, x1: zx + c + 1, y1: y0, dz0: r * 15, dz1: r * 15 + 15,
          sp: [[zx + c + 0.5, y0 - 0.2, r * 15 + 7]] });
        for (c = 0; c < 3; c++) items.push({ k: 'panel', face: 'W', glass: (c + r + 1) % 2 === 1,
          x0: zx - 0.18, y0: y0 + c * 2, x1: zx, y1: y0 + c * 2 + 2, dz0: r * 15, dz1: r * 15 + 15,
          sp: [[zx - 0.2, y0 + c * 2 + 1, r * 15 + 7]] });
      }
      spreadInto(st, items, 0.03, 0.97);
      // 依存：パネルは対応する足場枠（同じ面・段・位置）が立ってからでないと付かない
      for (var pi = 0; pi < items.length; pi++) {
        var fr2 = u.scaffold.items[pi];
        if (!fr2) continue;
        if (items[pi].plan < fr2.plan + 0.2) items[pi].plan = fr2.plan + 0.2;
        if (items[pi].act < fr2.act + 0.2) items[pi].act = fr2.act + 0.2;
      }
      st.items = items;
      u.stages.exterior = st;
    }

    /* ---------- 設備：全工区に電気・衛生・空調の3系統 × 3段階 ---------- */
    var EQ_TRADES = ['elec', 'plumb', 'hvac'];
    function buildEquip(u) {
      var steelStart = 10 + u.f * 6 + u.z * 2;
      var zx = 4.5 + u.z * 3;
      var items = [];
      var concPs = 0, concPe = 0, concAs = 0, concAe = 0;
      for (var ti = 0; ti < 3; ti++) {
        var tr = EQ_TRADES[ti];
        var big = tr === 'hvac';
        var y = 3.9 + ti * 1.55;
        var pi2, seg;
        for (pi2 = 0; pi2 < 2; pi2++) {
          seg = { k: 'pipe', tr: tr, ph: 'pre', x0: zx + 0.3 + pi2 * 0.5, y0: y - 0.14,
            x1: zx + 0.8 + pi2 * 0.5, y1: y + 0.14, dz0: FH + 0.2, dz1: FH + 1.1, sp: [[zx + 0.5 + pi2 * 0.5, y, FH + 1]] };
          setAbs(seg, steelStart + 3.2 + pi2 * 0.7 + ti * 0.3, steelStart + 3.2 + pi2 * 0.7 + ti * 0.3 + lagJitter(61 + u.f + ti));
          items.push(seg);
        }
        var cps = u.curePlan + 0.3 + ti * 0.5, cas = u.cureAct + 0.3 + ti * 0.5;
        for (pi2 = 0; pi2 < 3; pi2++) {
          var sx = zx + 0.3 + pi2 * 0.85;
          seg = { k: 'pipe', tr: tr, ph: 'conc', x0: sx, y0: y - (big ? 0.3 : 0.16),
            x1: sx + 0.85, y1: y + (big ? 0.3 : 0.16),
            dz0: FH + 0.2, dz1: FH + (big ? 2.4 : 1.5), sp: [[sx, y, FH + 1]] };
          setAbs(seg, cps + pi2 * 1.1, cas + pi2 * 1.1);
          items.push(seg);
        }
        if (ti === 0) { concPs = cps; concAs = cas; }
        if (cps + 2 * 1.1 + 0.8 > concPe) concPe = cps + 2 * 1.1 + 0.8;
        if (cas + 2 * 1.1 + 0.8 > concAe) concAe = cas + 2 * 1.1 + 0.8;
        var fps = Math.max(POWER_PLAN + 0.3, steelStart + 19 + u.f * 2);
        var fas = Math.max(POWER_ACT + 0.3, steelStart + 19 + u.f * 2 + lagJitter(67 + u.f * 3 + ti));
        for (pi2 = 0; pi2 < 2; pi2++) {
          var fx = zx + 0.5 + pi2 * 1.1;
          seg = { k: 'fixture', tr: tr, ph: 'fix', x0: fx, y0: y - 0.3, x1: fx + 0.62, y1: y + 0.3,
            dz0: FH + 0.4, dz1: FH + (tr === 'elec' ? 1.6 : 2.2), sp: [[fx + 0.3, y, FH + 1.5]] };
          setAbs(seg, fps + pi2 * 0.9, fas + pi2 * 0.9);
          items.push(seg);
        }
      }
      u.gates.press = { kind: 'press', label: '隠蔽前試験（圧力・通水）', plan: concPe + 0.1, act: concAe + 0.1, dur: 0.4 };
      var st = mkStageAbs('elec', '設備（電気・衛生・空調）', steelStart + 3, 0, steelStart + 3, 0, 4);
      st.ps = steelStart + 3; st.pe = Math.max(POWER_PLAN + 2.4, steelStart + 21.5 + u.f * 2);
      st.as = steelStart + 3; st.ae = Math.max(POWER_ACT + 2.4, steelStart + 21.5 + u.f * 2 + 1);
      st.items = items;
      u.stages.equip = st;
    }
    function buildInterior(u) {
      if (u.atrium) { u.stages.interior = null; return; }
      var steelStart = 10 + u.f * 6 + u.z * 2;
      var origPs = steelStart + 12 + u.z * 2 + u.f * 2;
      var st = mkStage('interior', '内装（ボード・仕上げ）', origPs, 9, 8, 71 + u.f * 11 + u.z * 5);
      st.origPs = origPs;
      var zx = 4.5 + u.z * 3, xm = zx + 1.5, xe = zx + 3, y0 = 3.5, y1 = 9.5;
      var boards = [], tiles = [];
      boards.push({ k: 'board', x0: zx, y0: y1 - 0.18, x1: xm, y1: y1, dz0: FH, dz1: FH + 14, sp: [[zx + 0.75, y1 - 0.2, FH + 7]] });
      boards.push({ k: 'board', x0: xm, y0: y1 - 0.18, x1: xe, y1: y1, dz0: FH, dz1: FH + 14, sp: [[xm + 0.75, y1 - 0.2, FH + 7]] });
      boards.push({ k: 'board', x0: xe - 0.18, y0: y0, x1: xe, y1: 6.5, dz0: FH, dz1: FH + 14, sp: [[xe - 0.2, y0 + 1.5, FH + 7]] });
      boards.push({ k: 'board', x0: xe - 0.18, y0: 6.5, x1: xe, y1: y1, dz0: FH, dz1: FH + 14, sp: [[xe - 0.2, 6.5 + 1.5, FH + 7]] });
      for (var ix = 0; ix < 3; ix++) for (var iy = 0; iy < 2; iy++)
        tiles.push({ k: 'tile', alt: (ix + iy) % 2 === 0, x0: zx + ix, y0: y0 + iy * 3, x1: zx + ix + 1, y1: y0 + iy * 3 + 3,
          dz0: FH, dz1: FH + 0.5, sp: [[zx + ix + 0.5, y0 + iy * 3 + 1.5, FH + 0.5]] });
      spreadInto(st, boards, 0.04, 0.42);
      spreadInto(st, tiles, 0.50, 0.96);
      st.items = boards.concat(tiles);
      u.stages.interior = st;
    }
    function buildRoof(u) {
      if (!isTopFloor(u.f)) { u.roof = null; return; }
      var base = 12 + FLOORS * 8 + u.z;
      var st = mkStage('roof', '屋根防水・笠木', base, 6, 4, 83 + u.z * 3);
      var zx = 4.5 + u.z * 3, xm = zx + 1.5, xe = zx + 3, y0 = 3.5, y1 = 9.5;
      var items = [];
      var xs = [[zx, xm], [xm, xe]], ys = [[y0, 6.5], [6.5, y1]];
      for (var i = 0; i < 2; i++) for (var j = 0; j < 2; j++)
        items.push({ k: 'sheet', x0: xs[i][0], y0: ys[j][0], x1: xs[i][1], y1: ys[j][1], dz0: FH, dz1: FH + 0.7,
          sp: [[(xs[i][0] + xs[i][1]) / 2, (ys[j][0] + ys[j][1]) / 2, FH + 0.7]] });
      items.push({ k: 'parapet', x0: zx, y0: y0, x1: xe, y1: y0 + 0.3, dz0: FH, dz1: FH + 3.5, sp: [[xm, y0 + 0.15, FH + 3.5]] });
      items.push({ k: 'parapet', x0: zx, y0: y1 - 0.3, x1: xe, y1: y1, dz0: FH, dz1: FH + 3.5, sp: [[xm, y1 - 0.15, FH + 3.5]] });
      spreadInto(st, items, 0.05, 0.95);
      st.items = items;
      u.roof = st;
    }
    function buildRoofEq(u) {
      if (!isTopFloor(u.f)) { u.roofEq = null; return; }
      var st = mkStage('hvac', '屋上設備・受電', POWER_PLAN - 2.5 + u.z, 5, 3, 89 + u.z * 3);
      var zx = 4.5 + u.z * 3, y0 = 3.5;
      var items = [];
      items.push({ k: 'acunit', x0: zx + 0.3, y0: y0 + 0.5, x1: zx + 1.1, y1: y0 + 1.3, dz0: FH + 0.7, dz1: FH + 3.4, sp: [[zx + 0.7, y0 + 0.9, FH + 3.4]] });
      items.push({ k: 'acunit', x0: zx + 1.4, y0: y0 + 0.5, x1: zx + 2.2, y1: y0 + 1.3, dz0: FH + 0.7, dz1: FH + 3.4, sp: [[zx + 1.8, y0 + 0.9, FH + 3.4]] });
      items.push({ k: 'pipe', tr: 'hvac', ph: 'roof', x0: zx + 0.4, y0: y0 + 2.6, x1: zx + 2.6, y1: y0 + 3.0, dz0: FH + 0.7, dz1: FH + 1.8, sp: [[zx + 1.5, y0 + 2.8, FH + 1.8]] });
      if (u.z === 1) { // キュービクル＝受電の山場（日付は POWER_* に一致）
        var cub = { k: 'cubicle', x0: zx + 0.9, y0: y0 + 4.2, x1: zx + 2.1, y1: y0 + 5.4, dz0: FH + 0.7, dz1: FH + 4.6, sp: [[zx + 1.5, y0 + 4.8, FH + 4.6]] };
        setAbs(cub, POWER_PLAN, POWER_ACT);
        items.push(cub);
      }
      spreadInto(st, items.slice(0, 3), 0.1, 0.85);
      st.items = items;
      u.roofEq = st;
    }

    /* ---------- エレベーター：シャフトはピット（1F床下）から最上階天井まで
       連続した1本。高さは絶対 z で持ち、各階セグメントはその階の床高を
       基準に「1回だけ」積む（zBase の二重加算を構造的に排除する）。
       EV 部材（レール・かご・ドア）も dz0/dz1 に絶対 z を格納する規約で、
       描画は drawEV から zBase=0 で呼ぶ単一経路のみ（工区の zBase を
       足し直す経路は存在しない） ---------- */
    function buildEV() {
      var railStart = 10 + FLOORS * 6.5;
      var st = mkStageAbs('ev', 'エレベーター工事', railStart, POWER_PLAN + 10, railStart + 0.5, POWER_ACT + 10, 3);
      var items = [], f;
      for (f = 0; f < FLOORS; f++) {
        var zb = 6 + f * FH; // FOUND_H + f*FLOOR_H（この階の床高・絶対z）
        items.push({ k: 'evrail', fl: f, x0: 8.58, y0: 4.00, x1: 9.42, y1: 4.40,
          dz0: zb + 2, dz1: zb + FH - 2, sp: [[9, 4.2, zb + FH / 2]] });
      }
      items.push({ k: 'evcar', x0: 8.70, y0: 3.90, x1: 9.30, y1: 4.55, dz0: 6 + 2, dz1: 6 + 17, sp: [[9, 4.2, 6 + 17]] });
      for (f = 0; f < FLOORS; f++) {
        var zb2 = 6 + f * FH;
        items.push({ k: 'evdoor', fl: f, x0: 8.68, y0: 4.78, x1: 9.32, y1: 4.88,
          dz0: zb2 + 1.5, dz1: zb2 + 15.5, sp: [[9, 4.83, zb2 + 15]] });
      }
      var times = [];
      for (f = 0; f < FLOORS; f++) times.push([railStart + f * 4, railStart + f * 4 + 0.7]);
      times.push([railStart + FLOORS * 4 + 2, railStart + FLOORS * 4 + 2.8]); // かご
      for (f = 0; f < FLOORS; f++) times.push([railStart + f * 2 + 1, railStart + f * 2 + 1.8]); // ドア
      for (var i = 0; i < items.length && i < times.length; i++) setAbs(items[i], times[i][0], times[i][1]);
      st.items = items;
      EVST = st;
      EVST.testGate = { kind: 'evtest', label: 'EV試運転・検査',
        plan: POWER_PLAN + 9, act: POWER_ACT + 9.2, dur: 0.8 };
      // シャフト壁：全セグメントが「z0＝その階の床高、z1＝z0＋階高」を厳密に満たす
      // 形で格納する（不変条件・全パラメータ組合せで成立）。乗場開口は格納データでは
      // 作らず、ホール側の壁に opening フラグを付け、描画時にだけ袖壁＋まぐさへ
      // 分割する。壁の時刻はここでは仮置きし、buildModel の全シフト（強度確認
      // ゲート・天候）が終わった後に finalizeEVShaft() が最終の躯体ステージから
      // 決め直す（生成時点のステージを掴むと、後段のシフトで壁だけ取り残される）。
      EVSHAFT = { walls: [],
        pit: { plan: 9.5, act: 10.5 },
        cap: { plan: 14 + FLOORS * 9.5, act: 15 + FLOORS * 9.5 },
        machine: { plan: 16 + FLOORS * 9.5, act: 17 + FLOORS * 9.5 } };
      for (f = 0; f < FLOORS; f++) {
        var zb3 = 6 + f * FH; // FOUND_H + f*FLOOR_H（この階の床高・絶対z、加算はここで1回だけ）
        var segs = [
          [8.40, 3.66, 9.60, 3.80, zb3, zb3 + FH, 0],
          [8.40, 3.80, 8.54, 4.90, zb3, zb3 + FH, 0],
          [9.46, 3.80, 9.60, 4.90, zb3, zb3 + FH, 0],
          [8.40, 4.76, 9.60, 4.90, zb3, zb3 + FH, 1] // ホール側：乗場開口つき
        ];
        for (var si = 0; si < segs.length; si++) {
          var sg = segs[si];
          EVSHAFT.walls.push({ fl: f, x0: sg[0], y0: sg[1], x1: sg[2], y1: sg[3],
            z0: sg[4], z1: sg[5], opening: !!sg[6], plan: 0, act: 0 });
        }
      }
    }
    /* シャフト壁の時刻を、その階（中央工区）の最終確定した躯体ステージから
       決め直す。buildModel の最後（全シフト適用後）に1回だけ呼ばれる単一経路 */
    function finalizeEVShaft() {
      if (!EVSHAFT) return;
      for (var i = 0; i < EVSHAFT.walls.length; i++) {
        var wl = EVSHAFT.walls[i];
        var cu = U(wl.fl, 1);
        if (!cu || !cu.stages.steel) continue;
        var sst = cu.stages.steel;
        wl.plan = sst.ps + (sst.pe - sst.ps) * 0.82;
        wl.act = sst.as + (sst.ae - sst.as) * 0.84;
      }
    }

    /* ---------- モデル再生成：パラメータから現場を全部作り直す ---------- */
    function buildModel() {
      FLOORS = PARAMS.floors;
      POWER_PLAN = 12 + FLOORS * 11;
      POWER_ACT = POWER_PLAN + 1;
      EST_DAYS = 34 + FLOORS * 9;
      var K = EST_DAYS / 60;
      RAIN = { from: EST_DAYS * 0.30, to: EST_DAYS * 0.30 + 3 };
      RAIN2 = { from: EST_DAYS * 0.66, to: EST_DAYS * 0.66 + 1.2 };
      WIND = { from: EST_DAYS * 0.44, to: EST_DAYS * 0.44 + 0.8 };
      BACKFILL = { from: 12 * K, to: 16.5 * K };
      WASTE_DAYS = [20, 33, 46, 55].map(function (d) { return d * K; });
      MOBILE_CRANE_DAYS = [2, 4, 6, 8, 9];

      units = []; UNITMAP = {}; LAYER_GATES = [];
      var f, z, i, j;
      for (f = 0; f < FLOORS; f++) {
        var zs = plateZones(f);
        for (var zi = 0; zi < zs.length; zi++) {
          z = zs[zi];
          var u = {
            z: z, f: f, atrium: (z === 1 && f >= 1),
            stages: {}, gates: {}, curePlan: 0, cureAct: 0,
            scaffold: null, scaffoldOut: null, roof: null, roofEq: null
          };
          units.push(u);
          UNITMAP[f * 3 + z] = u;
        }
      }
      EARTH = mkStage('earth', '掘削・山留め・整地', 0, 7, 7, 11);
      buildFoundation();
      for (i = 0; i < units.length; i++) {
        buildFrame(units[i]);
        buildScaffold(units[i]);
        buildExterior(units[i]);
        buildEquip(units[i]);
        buildInterior(units[i]);
        buildRoof(units[i]);
        buildRoofEq(units[i]);
      }
      buildEV();
      // 層間ふさぎ確認：その階の全工区の隠蔽前試験が終わってから（階単位のゲート）
      for (f = 0; f < FLOORS; f++) {
        var mp = 0, ma = 0, anyU = false;
        for (z = 0; z < 3; z++) {
          var uu = U(f, z);
          if (!uu) continue;
          anyU = true;
          var g = uu.gates.press;
          if (g.plan + g.dur > mp) mp = g.plan + g.dur;
          if (g.act + g.dur > ma) ma = g.act + g.dur;
        }
        LAYER_GATES[f] = anyU ? { kind: 'layer', label: '層間ふさぎ確認', plan: mp + 0.2, act: ma + 0.2, dur: 0.4, fl: f } : null;
      }
      // 内装の開始をゲートの後ろへ寄せる（隠蔽前試験＋層間ふさぎ＋PCa接合確認）
      for (i = 0; i < units.length; i++) {
        var u2 = units[i], st2 = u2.stages.interior;
        if (!st2) continue;
        var needP = Math.max(u2.gates.press.plan + u2.gates.press.dur + 0.2,
          LAYER_GATES[u2.f] ? LAYER_GATES[u2.f].plan + LAYER_GATES[u2.f].dur + 0.2 : 0);
        var needA = Math.max(u2.gates.press.act + u2.gates.press.dur + 0.2,
          LAYER_GATES[u2.f] ? LAYER_GATES[u2.f].act + LAYER_GATES[u2.f].dur + 0.2 : 0);
        if (u2.gates.joint) {
          needP = Math.max(needP, u2.gates.joint.plan + u2.gates.joint.dur + 0.2);
          needA = Math.max(needA, u2.gates.joint.act + u2.gates.joint.dur + 0.2);
        }
        var dP = Math.max(0, needP - st2.ps), dA = Math.max(0, needA - st2.as);
        if (dP > 0) { st2.ps += dP; st2.pe += dP; for (j = 0; j < st2.items.length; j++) st2.items[j].plan += dP; }
        if (dA > 0) shiftStageActs(st2, dA);
      }
      // 強度確認（RC/SRC）：合格するまで真上の階の躯体は始められない
      for (i = 0; i < units.length; i++) {
        var below = units[i];
        if (!below.gates.strength) continue;
        var above = U(below.f + 1, below.z);
        if (!above) continue;
        var sg = below.gates.strength;
        var ndP = Math.max(0, (sg.plan + sg.dur + 0.2) - above.stages.steel.ps);
        var ndA = Math.max(0, (sg.act + sg.dur + 0.2) - above.stages.steel.as);
        if (ndP > 0 || ndA > 0) shiftUnitFrame(above, ndP, ndA);
      }
      // 搬入遅れは該当工区だけに効く（1F東の内装材が遅れる）
      var u02 = U(0, 2);
      if (u02 && u02.stages.interior) shiftStageActs(u02.stages.interior, 2.2);
      // 職人の手配が付かず最上階・中の躯体が少し遅れる
      var uTop = U(FLOORS - 1, 1);
      if (uTop) shiftUnitFrame(uTop, 0, 1.0);

      eachStage(applyWeatherToStage);

      // シャフト壁の時刻を最終の躯体ステージに合わせ直す（全シフト適用後・単一経路）
      finalizeEVShaft();

      // 竣工日：全ステージ・全ゲートの実績最大値から決める（必ず到達する）
      var maxT = 0;
      eachStage(function (st) {
        if (!st) return;
        if (st.ae > maxT) maxT = st.ae;
        if (st.items) for (var q = 0; q < st.items.length; q++) {
          if (st.items[q].act > maxT) maxT = st.items[q].act;
          if (st.items[q].rmvA != null && st.items[q].rmvA > maxT) maxT = st.items[q].rmvA;
        }
      });
      for (i = 0; i < units.length; i++) {
        if (units[i].scaffoldOut && units[i].scaffoldOut.ae > maxT) maxT = units[i].scaffoldOut.ae;
        for (var gk in units[i].gates) {
          var gg = units[i].gates[gk];
          if (gg && gg.act + gg.dur > maxT) maxT = gg.act + gg.dur;
        }
      }
      for (f = 0; f < LAYER_GATES.length; f++)
        if (LAYER_GATES[f] && LAYER_GATES[f].act + LAYER_GATES[f].dur > maxT) maxT = LAYER_GATES[f].act + LAYER_GATES[f].dur;
      if (EVST && EVST.testGate.act + EVST.testGate.dur > maxT) maxT = EVST.testGate.act + EVST.testGate.dur;
      TOTAL_DAYS = Math.ceil(maxT + 2.5);

      MEM_TOTAL = 0;
      eachStage(function (st) { if (st && st.items) MEM_TOTAL += st.items.length; });
      // 描画キャッシュを捨てる
      MAT_ITEMS = null; TRUCK_EVENTS = null; CRANE_DAYS = null;
      fadeFloor = []; fadeWall = [];
      for (f = 0; f < FLOORS; f++) { fadeFloor.push(1); fadeWall.push(1); }
    }

    /* ---------- 天候は作業ごとに効き方が違う ---------- */
    var RAIN_KINDS = { pour: 1, panel: 1, sheet: 1 };
    var FACTORY_KINDS = { col: 1, beam: 1, sbeam: 1, plate: 1, panel: 1, sheet: 1, parapet: 1, acunit: 1, cubicle: 1, evcar: 1, pccol: 1, pcbeam: 1, pcslab: 1 };
    function weatherBlock(kind, t) {
      if (RAIN_KINDS[kind]) {
        if (t >= RAIN.from && t < RAIN.to) return RAIN.to;
        if (t >= RAIN2.from && t < RAIN2.to) return RAIN2.to;
      }
      if (FACTORY_KINDS[kind] && t >= WIND.from && t < WIND.to) return WIND.to;
      return 0;
    }
    function applyWeatherToStage(st) {
      if (!st || !st.items) return;
      var items = st.items.slice().sort(function (a, b) { return a.act - b.act; });
      var shift = 0;
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (it.k === 'pour') {
          var w0 = weatherBlock('pour', it.aStart + shift);
          if (w0) shift += w0 - (it.aStart + shift) + 0.05;
          it.aStart += shift; it.act += shift;
          continue;
        }
        var w = weatherBlock(it.k, it.act + shift);
        if (w) shift += w - (it.act + shift) + 0.05;
        it.act += shift;
        if (it.rmvA != null) it.rmvA += shift * 0.3;
      }
      if (shift > 0) st.ae = Math.max(st.ae, st.ae + shift * 0.5);
    }
    function eachStage(fn) {
      fn(EARTH); fn(FOUND); fn(EVST);
      for (var i = 0; i < units.length; i++) {
        var u = units[i];
        fn(u.stages.steel); fn(u.stages.exterior); fn(u.stages.equip);
        if (u.scaffold) fn(u.scaffold);
        if (u.stages.interior) fn(u.stages.interior);
        if (u.roof) fn(u.roof);
        if (u.roofEq) fn(u.roofEq);
      }
    }

    /* ---------- 進捗の数え方 ---------- */
    var MEM_TOTAL = 0;
    function countPlaced(st, t, actual) {
      if (!st || !st.items) return 0;
      var n = 0;
      for (var i = 0; i < st.items.length; i++)
        if ((actual ? st.items[i].act : st.items[i].plan) <= t) n++;
      return n;
    }
    function stageProg(st, t, actual) {
      if (!st) return 0;
      if (st.items) return st.items.length ? countPlaced(st, t, actual) / st.items.length : 0;
      return actual ? prog(t, st.as, st.ae) : prog(t, st.ps, st.pe);
    }
    function membersPlaced(t, actual) {
      var n = 0;
      eachStage(function (st) { n += countPlaced(st, t, actual); });
      return n;
    }
    function scaffoldDownCount(u, t) {
      if (!u.scaffold) return 0;
      var n = 0, items = u.scaffold.items;
      for (var i = 0; i < items.length; i++) if (items[i].rmvA <= t) n++;
      return n;
    }
    function unitProgress(u, t, actual) {
      var w = 0, s = 0;
      var parts = [['steel', 0.34], ['exterior', 0.17], ['equip', 0.19], ['interior', 0.20]];
      for (var i = 0; i < parts.length; i++) {
        var st = u.stages[parts[i][0]];
        if (!st) continue;
        w += parts[i][1];
        s += parts[i][1] * stageProg(st, t, actual);
      }
      if (u.scaffold) { w += 0.05; s += 0.05 * stageProg(u.scaffold, t, actual); }
      if (u.roof) { w += 0.03; s += 0.03 * stageProg(u.roof, t, actual); }
      if (u.roofEq) { w += 0.02; s += 0.02 * stageProg(u.roofEq, t, actual); }
      return w ? s / w : 0;
    }
    function overallProgress(t, actual) {
      var s = 0;
      s += 0.05 * stageProg(EARTH, t, actual) + 0.07 * stageProg(FOUND, t, actual) + 0.02 * stageProg(EVST, t, actual);
      var us = 0;
      for (var i = 0; i < units.length; i++) us += unitProgress(units[i], t, actual);
      return s + 0.86 * (units.length ? us / units.length : 0);
    }

    /* ---------- 床の状態（全テンプレート共通の後段前提） ---------- */
    function pourItemOf(u) {
      var items = (u.stages.steel && u.stages.steel.items) || [];
      for (var i = 0; i < items.length; i++) if (items[i].k === 'pour') return items[i];
      return null;
    }
    function pourInfo(u, t) {
      var it = pourItemOf(u);
      if (!it) return { state: '', frac: 0, phase: 0 };
      if (t >= it.act) return { state: 'done', frac: 1, phase: 0 };
      if (t >= it.aStart) {
        var fe = clamp01((t - it.aStart) / (it.act - it.aStart));
        var ft = fe * it.trucks;
        var k = Math.min(it.trucks - 1, Math.floor(ft));
        var local = ft - k;
        var strip = clamp01((local - 0.22) / 0.53);
        return { state: 'pouring', frac: (k + strip) / it.trucks, phase: local };
      }
      if (t >= it.pStart) return { state: 'ghost', frac: 0, phase: 0 };
      return { state: '', frac: 0, phase: 0 };
    }
    function floorState(u, t) {
      if (pourItemOf(u)) return pourInfo(u, t);
      // PCa：床版（pcslab）の吊り込み枚数が床の出来具合
      var items = (u.stages.steel && u.stages.steel.items) || [];
      var tot = 0, done = 0, planAny = false, i;
      for (i = 0; i < items.length; i++) {
        if (items[i].k !== 'pcslab') continue;
        tot++;
        if (items[i].act <= t) done++;
        if (items[i].plan <= t) planAny = true;
      }
      if (!tot) { // 吹抜け等：躯体ステージの進みで代用
        var p = stageProg(u.stages.steel, t, true);
        return { state: p >= 1 ? 'done' : p > 0 ? 'pouring' : '', frac: p, phase: 0 };
      }
      if (done >= tot) return { state: 'done', frac: 1, phase: 0 };
      if (done > 0) return { state: 'pouring', frac: done / tot, phase: 0 };
      if (planAny && ghostOn) return { state: 'ghost', frac: 0, phase: 0 };
      return { state: '', frac: 0, phase: 0 };
    }

    /* ---------- 検査ゲートの状態 ---------- */
    var GATE_KEYS = ['frame', 'rebar', 'strength', 'joint', 'press'];
    function gateState(g, t, actual) {
      if (!g) return '';
      var s = actual ? g.act : g.plan;
      if (t < s) return 'before';
      if (t < s + g.dur) return 'during';
      return 'done';
    }
    function activeGate(u, t) {
      for (var i = 0; i < GATE_KEYS.length; i++) {
        var g = u.gates[GATE_KEYS[i]];
        if (g && gateState(g, t, true) === 'during') return g;
      }
      var lg = LAYER_GATES[u.f];
      if (lg && gateState(lg, t, true) === 'during') return lg;
      return null;
    }
    function activeStage(u, t) {
      var g = activeGate(u, t);
      if (g) return { st: { trade: 'insp', work: g.label + '（立会い・判定中）', crew: 0 }, p: 0.5, gate: g };
      var order = ['steel', 'scaffold', 'exterior', 'equip', 'interior'];
      var best = null;
      for (var i = 0; i < order.length; i++) {
        var st = order[i] === 'scaffold' ? u.scaffold : u.stages[order[i]];
        if (!st) continue;
        var p = stageProg(st, t, true);
        if (p > 0 && p < 1) return { st: st, p: p };
        if (p >= 1) best = { st: st, p: 1 };
      }
      if (u.scaffold) {
        var dn = scaffoldDownCount(u, t), tot = u.scaffold.items.length;
        if (dn > 0 && dn < tot) return { st: u.scaffoldOut, p: dn / tot };
        if (tot > 0 && dn >= tot) best = { st: u.scaffoldOut, p: 1 };
      }
      if (u.roof) {
        var rp = stageProg(u.roof, t, true);
        if (rp > 0 && rp < 1) return { st: u.roof, p: rp };
      }
      if (u.roofEq) {
        var qp = stageProg(u.roofEq, t, true);
        if (qp > 0 && qp < 1) return { st: u.roofEq, p: qp };
      }
      return best;
    }
    function phaseName(t) {
      var fr = TOTAL_DAYS ? t / TOTAL_DAYS : 0;
      if (fr < 0.12) return '土工事';
      if (fr < 0.20) return '基礎・躯体工事';
      if (fr < 0.48) return '躯体工事';
      if (fr < 0.68) return '躯体・外装工事';
      if (fr < 0.78) return '内装・仕上げ工事';
      if (fr < 0.85) return '受電・器具付け';
      if (fr < 0.96) return '試運転・仕上げ';
      return '竣工間近';
    }
    function anyGateDuring(t) {
      for (var i = 0; i < units.length; i++) {
        var g = activeGate(units[i], t);
        if (g) return { u: units[i], g: g };
      }
      return null;
    }
    function anyScaffoldBusy(t) {
      for (var i = 0; i < units.length; i++) {
        var p = stageProg(units[i].scaffold, t, true);
        if (p > 0 && p < 1) return true;
      }
      return false;
    }
    function eventCaption(t) {
      var ag = anyGateDuring(t);
      if (ag) return ag.g.label + 'の立会い中 — 合格するまで次の工程は始まらない';
      if (t >= RAIN.from && t < RAIN.to) return '長雨 — 打設とシーリングは中止。できる作業だけが進む';
      if (t >= WIND.from && t < WIND.to + 0.6) return '強風で揚重中止 — ラフタークレーンは来ない';
      if (t >= RAIN2.from && t < RAIN2.to) return '雨 — 屋根とシーリングは中止';
      if (t >= POWER_ACT - 0.4 && t < POWER_ACT + 1.2) return '受電の山場 — キュービクルに電気が入る。これで試運転が始められる';
      if (EVST && t >= EVST.testGate.act - 0.3 && t < EVST.testGate.act + EVST.testGate.dur + 0.6) return 'エレベーター試運転・検査 — 単独ラインの最終関門';
      if (PARAMS.method === 'pca' && t > 9 && t < 14) return 'PCa部材が完成品で届き、ラフターで吊り込まれる。現場加工の束は出ない';
      if (PARAMS.frame !== 'S' && PARAMS.method !== 'pca' && t > 9 && t < 14) return '型枠は材料の山から建て込み、配筋は束から組み上げる。実体は打設で生まれる';
      if (anyScaffoldBusy(t) && t < EST_DAYS * 0.5) return '鳶が外部足場を組立中 — 足場は外装より数段先に立つ';
      var u02 = U(0, 2);
      if (u02 && u02.stages.interior && stageProg(u02.stages.interior, t, true) > 0 && stageProg(u02.stages.interior, t, true) < 1 && t > EST_DAYS * 0.35 && t < EST_DAYS * 0.55)
        return '搬入遅れ — 1F東工区の内装材だけが遅れている';
      if (t >= BACKFILL.from && t < BACKFILL.to + 3) return '埋め戻し・転圧 — 基礎の周りの地面が戻っていく';
      if (t >= 5 && t < 10) return '生コン車が一台ずつ来て基礎を打設 — 型枠は材料の山から建て込まれる';
      if (t >= 10 && t < 12) return 'ラフタークレーンが入って躯体の建方が始まった';
      if (t >= TOTAL_DAYS - 3) return '竣工が見えてきた';
      return '';
    }

    /* ---------- 描画セットアップ ---------- */
    var cv = document.getElementById('cv');
    var ctx = cv.getContext('2d');
    var stageEl = document.getElementById('stage');
    var TW = 42, TH = 21, FLOOR_H = 30, FOUND_H = 6;
    var WORLD_W = 780, WORLD_H = 460;
    var view = { s: 1, tx: 0, ty: 0, w: 0, h: 0, dpr: 1 };

    var SITE = { x0: 1, y0: 1, x1: 16, y1: 12 };
    var BLD = { x0: 4.5, y0: 3.5, x1: 13.5, y1: 9.5 };
    var ZONE_X = [4.5, 7.5, 10.5, 13.5];
    /* 敷地形状：輪郭ポリゴン。南辺（y=12）にゲートの開口を持つ */
    function sitePolygon() {
      if (PARAMS.site === 'trap') return [[2.5, 1], [14.5, 1], [16, 12], [1, 12]];
      if (PARAMS.site === 'L') return [[4, 1], [16, 1], [16, 12], [1, 12], [1, 4.5], [4, 4.5]];
      return [[1, 1], [16, 1], [16, 12], [1, 12]];
    }
    var GATE = { x0: 7.6, x1: 10.4, y: 12 }; // 南辺のゲート開口

    function resize() {
      var r = stageEl.getBoundingClientRect();
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.max(1, Math.round(r.width * dpr));
      cv.height = Math.max(1, Math.round(r.height * dpr));
      view.w = r.width; view.h = r.height;
      view.s = Math.min(r.width / WORLD_W, r.height / WORLD_H);
      view.tx = (r.width - WORLD_W * view.s) / 2;
      view.ty = (r.height - WORLD_H * view.s) / 2;
      view.dpr = dpr;
    }
    window.addEventListener('resize', resize);

    /* ---------- 4方向回転 ---------- */
    var ROT = 0;
    var RCX = 8.75, RCY = 6.5;
    function rotXY(x, y) {
      var dx = x - RCX, dy = y - RCY;
      if (ROT === 0) return [x, y];
      if (ROT === 1) return [RCX + dy, RCY - dx];
      if (ROT === 2) return [RCX - dx, RCY - dy];
      return [RCX - dy, RCY + dx];
    }
    var OX = 343, OY = 60;
    function P(x, y, z) {
      var r = rotXY(x, y);
      return [OX + (r[0] - r[1]) * TW / 2, OY + (r[0] + r[1]) * TH / 2 - (z || 0)];
    }
    function worldToScreen(x, y, z) {
      var p = P(x, y, z);
      return [view.tx + p[0] * view.s, view.ty + p[1] * view.s];
    }
    function poly(pts, fill, stroke, alpha) {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.closePath();
      if (fill) {
        ctx.globalAlpha = alpha == null ? 1 : alpha;
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
    function shade(hex, amt) {
      var n = parseInt(hex.slice(1), 16);
      var r = Math.max(0, Math.min(255, (n >> 16) + amt));
      var g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
      var b = Math.max(0, Math.min(255, (n & 255) + amt));
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }
    function mixHex(h1, h2, f) {
      var a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
      var r = Math.round((a >> 16) + ((b >> 16) - (a >> 16)) * f);
      var g = Math.round(((a >> 8) & 255) + (((b >> 8) & 255) - ((a >> 8) & 255)) * f);
      var bl = Math.round((a & 255) + ((b & 255) - (a & 255)) * f);
      return 'rgb(' + r + ',' + g + ',' + bl + ')';
    }
    function drawBox(x0, y0, x1, y1, z0, z1, colors, opt) {
      opt = opt || {};
      var aTop = opt.aTop == null ? 1 : opt.aTop;
      var aE = opt.aE == null ? 0.92 : opt.aE;
      var aS = opt.aS == null ? 0.72 : opt.aS;
      var edge = 'rgba(30,40,50,0.22)';
      var cE = colors.east, cS = colors.south;
      var cW = colors.west || shade(colors.east, -28);
      var cN = colors.north || shade(colors.south, -28);
      var right, front;
      if (ROT === 0) { right = ['px', cE, aE]; front = ['py', cS, aS]; }
      else if (ROT === 1) { right = ['py', cS, aE]; front = ['nx', cW, aS]; }
      else if (ROT === 2) { right = ['nx', cW, aE]; front = ['ny', cN, aS]; }
      else { right = ['ny', cN, aE]; front = ['px', cE, aS]; }
      function face(kind) {
        if (kind === 'px') return [P(x1, y0, z1), P(x1, y1, z1), P(x1, y1, z0), P(x1, y0, z0)];
        if (kind === 'nx') return [P(x0, y1, z1), P(x0, y0, z1), P(x0, y0, z0), P(x0, y1, z0)];
        if (kind === 'py') return [P(x0, y1, z1), P(x1, y1, z1), P(x1, y1, z0), P(x0, y1, z0)];
        return [P(x1, y0, z1), P(x0, y0, z1), P(x0, y0, z0), P(x1, y0, z0)];
      }
      poly(face(right[0]), right[1], edge, right[2]);
      poly(face(front[0]), front[1], edge, front[2]);
      var top = [P(x0, y0, z1), P(x1, y0, z1), P(x1, y1, z1), P(x0, y1, z1)];
      poly(top, colors.top, edge, aTop);
      return top;
    }

    /* ---------- 状態 ---------- */
    var day = 0;
    var playing = false;
    var speed = 1;
    var ghostOn = true;
    var selected = null;
    var hover = null;
    var hitPolys = [];
    var lastTs = 0;
    var sliderActive = false;

    /* ---------- 階フォーカス / 屋根透過 ---------- */
    var focusMode = 'auto';
    var roofMode = 'auto';
    var effFocus = null;
    var fadeFloor = [1, 1, 1];
    var fadeWall = [1, 1, 1];
    var fadeRoof = 1;
    var fadeSite = 1;
    var G_ALPHA = 1, G_EXTRA = 1;
    var G_REBAR_FRAC = 1;
    var REBAR_LEAD = 0.35;

    function computeFocus(t) {
      if (focusMode === 'all') return null;
      if (focusMode !== 'auto') return focusMode;
      var best = null, bestScore = 0;
      for (var f = 0; f < FLOORS; f++) {
        var score = 0;
        for (var i = 0; i < units.length; i++) {
          var u = units[i];
          if (u.f !== f) continue;
          var ep = stageProg(u.stages.equip, t, true);
          if (ep > 0 && ep < 1) score += 1.5;
          if (u.stages.interior) {
            var ip = stageProg(u.stages.interior, t, true);
            if (ip > 0 && ip < 1) score += 2;
          }
        }
        if (score > bestScore) { bestScore = score; best = f; }
      }
      return best;
    }
    function updateFades(dt) {
      effFocus = computeFocus(day);
      var k = Math.min(1, dt * 4.5);
      for (var f = 0; f < FLOORS; f++) {
        var tFloor = (effFocus === null || f === effFocus) ? 1 : 0;
        var tWall = (effFocus === f) ? 0.20 : 1;
        fadeFloor[f] += (tFloor - fadeFloor[f]) * k;
        fadeWall[f] += (tWall - fadeWall[f]) * k;
      }
      var tRoof = roofMode === 'ghost' ? 0.13
        : roofMode === 'solid' ? 1
        : (effFocus === null ? 1 : effFocus === FLOORS - 1 ? 0.13 : 0);
      fadeRoof += (tRoof - fadeRoof) * k;
      var tSite = effFocus === null ? 1 : 0.4;
      fadeSite += (tSite - fadeSite) * k;
    }

    /* ---------- 1日のリズム ---------- */
    var TOD_LEN = 11000;
    function todInfo() {
      var p = (performance.now() % TOD_LEN) / TOD_LEN;
      function band(a, b, w) {
        if (p < a - w || p > b + w) return 0;
        if (p >= a && p <= b) return 1;
        if (p < a) return (p - (a - w)) / w;
        return 1 - (p - b) / w;
      }
      return {
        p: p,
        gather: band(0.0, 0.10, 0.035),
        rest: band(0.45, 0.55, 0.04),
        yurei: band(0.90, 1.0, 0.03)
      };
    }
    /* 集合・休憩の場所は仮設事務所（西フェンス際）の前。車両動線（南の縦ラインと
       南レーン）には被らない位置に置く */
    var OFFICE = { x0: 1.25, y0: 4.4, x1: 2.95, y1: 7.6 };
    function blendPos(wx, wy, slotIdx, tod) {
      var tx = wx, ty = wy, k = 0;
      if (tod.gather > 0) {
        tx = 3.15 + (slotIdx % 4) * 0.42; ty = 5.05 + Math.floor(slotIdx / 4) * 0.5;
        k = tod.gather;
      } else if (tod.yurei > 0) {
        tx = 3.15 + (slotIdx % 4) * 0.42; ty = 5.05 + Math.floor(slotIdx / 4) * 0.5;
        k = tod.yurei;
      } else if (tod.rest > 0) {
        tx = 3.15 + (slotIdx % 4) * 0.45; ty = 7.15 + Math.floor(slotIdx / 4) * 0.45;
        k = tod.rest;
      }
      if (k <= 0) return [wx, wy];
      var s = k * k * (3 - 2 * k);
      return [wx + (tx - wx) * s, wy + (ty - wy) * s];
    }

    /* ---------- 立入禁止ゾーン（人配置の除外） ----------
       柵が描かれる矩形をそのまま登録し、作業員・地面の作業員・巡回する担当者・
       足場の地上員すべての配置をこの外へ押し出す。floor: -1=地上, 0..=その階の床 */
    var NOENTRY = [];
    function computeNoEntry(t) {
      NOENTRY = [];
      for (var i = 0; i < units.length; i++) {
        var u = units[i];
        var x0 = ZONE_X[u.z], x1 = ZONE_X[u.z + 1];
        var frameP = stageProg(u.stages.steel, t, true);
        if (u.f === 0 && frameP > 0 && frameP < 1)
          NOENTRY.push({ x0: x0 - 0.1, x1: x1 + 0.1, y0: BLD.y1 - 0.05, y1: BLD.y1 + 0.95, floor: -1 }); // 作業直下
        var extP = stageProg(u.stages.exterior, t, true);
        if (extP > 0 && extP < 1)
          NOENTRY.push({ x0: x0 - 0.1, x1: x1 + 0.1, y0: BLD.y1 + 0.25, y1: BLD.y1 + 1.15, floor: -1 }); // 上下作業の直下
        if (u.atrium && u.f >= 1) { // 吹抜け周り（下階の床の上に柵）
          var below = U(u.f - 1, u.z);
          if (below && floorState(below, t).state === 'done')
            NOENTRY.push({ x0: x0 + 0.05, x1: x1 - 0.05, y0: BLD.y0 + 0.05, y1: BLD.y1 - 0.05, floor: u.f });
        }
      }
    }
    function pushOut(x, y, floor) {
      for (var i = 0; i < NOENTRY.length; i++) {
        var r = NOENTRY[i];
        if (r.floor !== floor) continue;
        if (x > r.x0 && x < r.x1 && y > r.y0 && y < r.y1) {
          // 一番近い辺の外へ押し出す
          var dl = x - r.x0, dr = r.x1 - x, dn = y - r.y0, ds = r.y1 - y;
          var m = Math.min(dl, dr, dn, ds);
          if (m === dl) x = r.x0 - 0.18;
          else if (m === dr) x = r.x1 + 0.18;
          else if (m === dn) y = r.y0 - 0.18;
          else y = r.y1 + 0.18;
        }
      }
      return [x, y];
    }

    /* ---------- 会話の話者位置 ---------- */
    var G_POS = { sup: null, mgr: null, insp: null, fore: {}, work: null, lift: null, office: null };

    /* ---------- シーン描画 ---------- */
    function draw() {
      var t = day;
      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      var sky = ctx.createLinearGradient(0, 0, 0, view.h);
      sky.addColorStop(0, '#a8d4ea');
      sky.addColorStop(1, '#dff0f7');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, view.w, view.h);
      ctx.translate(view.tx, view.ty);
      ctx.scale(view.s, view.s);
      hitPolys = [];
      G_POS.lift = null;
      computeNoEntry(t);

      drawScene(t);

      if ((t >= RAIN.from && t < RAIN.to) || (t >= RAIN2.from && t < RAIN2.to)) drawRain();

      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      var cx = view.w - 34, cy = 34;
      ctx.beginPath(); ctx.arc(cx, cy, 17, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill();
      ctx.strokeStyle = 'rgba(30,50,70,0.35)'; ctx.stroke();
      var na = -Math.PI / 2 - ROT * Math.PI / 2;
      var nx2 = cx + Math.cos(na) * 11, ny2 = cy + Math.sin(na) * 11;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(nx2, ny2);
      ctx.strokeStyle = '#d64545'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#17303f';
      ctx.font = '700 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('N', cx + Math.cos(na) * 19, cy + Math.sin(na) * 19 + 4);
    }

    function drawRain() {
      ctx.save();
      ctx.strokeStyle = 'rgba(70,120,170,0.5)';
      ctx.lineWidth = 1.2;
      var now = performance.now() / 1000;
      ctx.beginPath();
      for (var i = 0; i < 46; i++) {
        var x = hash(i * 3.3) * WORLD_W;
        var y = (hash(i * 7.7) * WORLD_H + now * 260 * (0.7 + hash(i))) % WORLD_H;
        ctx.moveTo(x, y);
        ctx.lineTo(x - 4, y + 13);
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawScene(t) {
