      G_ALPHA = 1; G_EXTRA = 1;
      poly([P(-1.5, -2.5, 0), P(19, -2.5, 0), P(19, 15.5, 0), P(-1.5, 15.5, 0)], '#9fbf8d');
      poly([P(-1.5, 12.9, 0), P(19, 12.9, 0), P(19, 15.5, 0), P(-1.5, 15.5, 0)], '#7c858e');
      poly([P(-1.3, 14.1, 0), P(18.8, 14.1, 0), P(18.8, 14.35, 0), P(-1.3, 14.35, 0)], 'rgba(255,255,255,0.5)');
      var sp = sitePolygon();
      var spts = [];
      for (var si = 0; si < sp.length; si++) spts.push(P(sp[si][0], sp[si][1], 0));
      poly(spts, '#cdbb9d', 'rgba(90,70,40,0.25)', fadeSite);

      drawYard(t);

      drawHouse(0.2, -2.4, 2.6, 1.9, '#e8e2d4');
      drawHouse(15.2, -2.6, 2.8, 2.0, '#dde4ea');
      drawHouse(18.6, 2.5, 2.4, 2.6, '#ead9c8');
      drawTree(14.8, -1.2); drawTree(-0.6, 4.5); drawTree(18.9, 6.5);

      drawEarthworks(t);

      drawFenceBack();
      drawRoutes(t);
      drawOffice(t);

      var ordered = units.slice().sort(function (a, b) { return (a.f - b.f) || (a.z - b.z); });
      for (var i = 0; i < ordered.length; i++) drawUnit(ordered[i], t);
      G_ALPHA = 1; G_EXTRA = 1;

      drawEV(t);

      if (units.length && stageProg(units[0].stages.steel, t, true) <= 0 && effFocus === null) drawGroundCrew(t);

      drawMixerTrucks(t);
      drawRoughCranes(t);
      drawBackfillMachines(t);
      drawPeopleGlobal(t);

      drawFence();
    }
    /* 搬入動線：ゲート→建物、ゲート→資材エリア。事務所や置場が
       この線を塞いでいないことが絵で確認できる */
    function drawRoutes(t) {
      ctx.save();
      ctx.strokeStyle = 'rgba(37,99,235,0.55)';
      ctx.lineWidth = 1.6;
      ctx.setLineDash([6, 5]);
      ctx.beginPath();
      var a = P(9, 12.6, 0.1), b = P(9, 10.55, 0.1);
      ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
      var c = P(9, 11.55, 0.1), d = P(14.6, 11.55, 0.1);
      ctx.moveTo(c[0], c[1]); ctx.lineTo(d[0], d[1]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(37,99,235,0.85)';
      ctx.font = '600 8.5px sans-serif'; ctx.textAlign = 'center';
      var lp = P(9.35, 11.0, 0);
      ctx.fillText('搬入動線', lp[0], lp[1]);
      var lp2 = P(11.8, 11.42, 0);
      ctx.fillText('ゲート→資材エリア', lp2[0], lp2[1]);
      ctx.restore();
    }

    function drawHouse(x, y, w, d, color) {
      drawBox(x, y, x + w, y + d, 0, 17, { top: shade(color, -30), east: shade(color, -18), south: shade(color, -6) }, { aS: 0.95, aE: 0.95 });
      drawBox(x + 0.25, y + 0.25, x + w - 0.25, y + d - 0.25, 17, 21, { top: '#8a5a4a', east: '#77503f', south: '#83564a' }, { aS: 0.95, aE: 0.95 });
    }
    function drawTree(x, y) {
      var b = P(x, y, 0), tp = P(x, y, 9);
      ctx.strokeStyle = '#6f4a29'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(b[0], b[1]); ctx.lineTo(tp[0], tp[1]); ctx.stroke();
      ctx.beginPath(); ctx.arc(tp[0], tp[1] - 3, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#5e9950'; ctx.fill();
      ctx.beginPath(); ctx.arc(tp[0] + 5, tp[1] + 1, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#6cab5c'; ctx.fill();
    }
    function drawMound(x, y, p) {
      if (p <= 0) return;
      var b = P(x, y, 0), tp = P(x, y, 6 * p);
      poly([P(x - 0.9, y + 0.7, 0), P(x + 0.9, y + 0.7, 0), tp], '#a97c50');
      poly([P(x - 0.9, y + 0.7, 0), tp, P(x, y - 0.8, 0)], '#8a613c');
    }

    /* ---------- 土工事・基礎 ---------- */
    function drawEarthworks(t) {
      var earthP = stageProg(EARTH, t, true);
      var foundP = stageProg(FOUND, t, true);
      var bf = prog(t, BACKFILL.from, BACKFILL.to);
      if (earthP > 0) {
        var digA = (0.25 + 0.55 * earthP) * (1 - bf * 0.88) * fadeSite;
        poly([P(BLD.x0, BLD.y0, 0), P(BLD.x1, BLD.y0, 0), P(BLD.x1, BLD.y1, 0), P(BLD.x0, BLD.y1, 0)],
          'rgba(122,84,50,' + Math.max(0, digA) + ')');
        if (bf < 1) {
          poly([P(BLD.x0, BLD.y1, 0), P(BLD.x1, BLD.y1, 0), P(BLD.x1 - 0.3, BLD.y1 - 0.4, 2.5 * earthP), P(BLD.x0 + 0.3, BLD.y1 - 0.4, 2.5 * earthP)],
            'rgba(140,100,58,' + (0.55 * (1 - bf) * fadeSite) + ')');
          poly([P(BLD.x1, BLD.y0, 0), P(BLD.x1, BLD.y1, 0), P(BLD.x1 - 0.3, BLD.y1 - 0.4, 2.5 * earthP), P(BLD.x1 - 0.3, BLD.y0 + 0.4, 2.5 * earthP)],
            'rgba(110,76,42,' + (0.5 * (1 - bf) * fadeSite) + ')');
          drawRetaining(BLD.x0, BLD.y0, BLD.x1, BLD.y0, earthP * (1 - bf));
          drawRetainingY(BLD.x0, BLD.y0, BLD.x0, BLD.y1, earthP * (1 - bf));
        }
        if (earthP < 1 || foundP < 1) {
          drawMound(14.6, 5.2, earthP);
          drawMound(15.3, 7.4, earthP * 0.8);
        }
        if (selected === 'ground' || hover === 'ground') {
          poly([P(BLD.x0, BLD.y0, 0), P(BLD.x1, BLD.y0, 0), P(BLD.x1, BLD.y1, 0), P(BLD.x0, BLD.y1, 0)], null, '#ffffff');
        }
        hitPolys.push({ poly: [P(BLD.x0, BLD.y0, 0), P(BLD.x1, BLD.y0, 0), P(BLD.x1, BLD.y1, 0), P(BLD.x0, BLD.y1, 0)], target: 'ground' });
      }
      if (foundP > 0 || stageProg(FOUND, t, false) > 0) {
        G_ALPHA = fadeSite;
        for (var fi = 0; fi < FOUND.items.length; fi++) {
          var fit = FOUND.items[fi];
          if (fit.act <= t) drawItem(fit, 0, 'solid');
          else if (fit.k === 'fslab' && fit.act - t < 1.1) drawFormwork(fit, clamp01(1 - (fit.act - t) / 1.1));
          else if (fit.plan <= t && ghostOn) drawItem(fit, 0, 'ghost');
        }
        G_ALPHA = 1;
        drawSparks(FOUND, 0, t);
        drawFormStack(t);
      }
      if (bf > 0 && bf < 1) {
        poly([P(BLD.x0 - 0.7, BLD.y1, 0), P(BLD.x1 + 0.7, BLD.y1, 0), P(BLD.x1 + 0.7, BLD.y1 + 0.7, 0), P(BLD.x0 - 0.7, BLD.y1 + 0.7, 0)],
          'rgba(160,130,90,' + (0.5 * bf * fadeSite) + ')');
      }
    }
    function drawRetaining(x0, y0, x1, y1, h01) {
      if (h01 <= 0.03) return;
      var h = 5 * h01;
      poly([P(x0, y0, 0), P(x1, y1, 0), P(x1, y1, h), P(x0, y0, h)], 'rgba(105,110,116,' + (0.85 * fadeSite) + ')');
      ctx.save();
      ctx.strokeStyle = 'rgba(60,64,70,0.55)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (var x = x0 + 0.35; x < x1; x += 0.35) {
        var a = P(x, y0, 0), b = P(x, y0, h);
        ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
      }
      ctx.stroke();
      ctx.restore();
    }
    function drawRetainingY(x0, y0, x1, y1, h01) {

    function liftCandidates(t) {

        for (s = 0; s < sts.length; s++) {

      for (i = 0; i < cands.length; i++)

      if (t0 && (set.count[d] || 0) >= 7) {
        for (i = 0; i < cands.length; i++)

      }

    function drawRoughCrane(lift, fd, t, idx) {

        ctx.fillStyle = 'rgba(140,95,0,0.9)';

      drawBox(px - 1.15, py - 0.5, px + 1.15, py + 0.5, 0, 4.2,
        { top: '#e8b93c', east: '#c99a26', south: '#dbad33' }, { aS: 0.97, aE: 0.97 });

    var MAT_ITEMS = null;

    function stockAt(items, t, leadIn, leadOut) {
      var a = 0, b = 0;
      for (var i = 0; i < items.length; i++) {

        if (items[i].act <= t + leadOut) b++;

      return a - b;

    function returnedPending(t) {

      // 支保工：デッキ/型枠〜打設〜養生の間、床の下に支保工の列が残る
      if (effFocus === u.f && !u.atrium) {
        var deckN = 0, deckItems = (u.stages.steel.items || []).filter(function (x) { return x.k === 'plate' || x.k === 'pcslab' || x.k === 'form'; });
        for (var pk = 0; pk < deckItems.length; pk++) if (deckItems[pk].act <= t) deckN++;
        var curing = pinf.state === 'done' && t < u.cureAct;
        if ((deckN > 0 && pinf.state !== 'done') || curing) {
          var propCols = { top: '#b9bec6', east: '#8d949e', south: '#a3aab3' };
          for (var gx = 0; gx < 3; gx++) for (var gy = 0; gy < 2; gy++)
            drawBox(x0 + 0.6 + gx * 1.0 - 0.05, y0 + 1.2 + gy * 3.4 - 0.05,
              x0 + 0.6 + gx * 1.0 + 0.05, y0 + 1.2 + gy * 3.4 + 0.05,
              zBase, frameTop - 2.6, propCols, { aTop: 0.9, aS: 0.9, aE: 0.9 });
        }
      }
      // 外装パネル・サッシ（全4面。フォーカス階では手前の壁を透かす）
      G_EXTRA = fadeWall[u.f];
      if (ghostOn) drawStageItemsGhost(u.stages.exterior, zBase, t);
      drawStageItems(u.stages.exterior, zBase, t);
      G_EXTRA = 1;
      drawScaffoldItems(u, zBase, t);
      drawScaffoldSheet(u, zBase, t);
      // 上下作業：足場上の外装と真下の作業が重なる時、直下に養生ネット＋立入禁止
      var extP = stageProg(u.stages.exterior, t, true);
      if (extP > 0 && extP < 1 && fadeFloor[u.f] > 0.5) {
        poly([P(x0, y1 + 0.52, zBase + 1), P(x1, y1 + 0.52, zBase + 1), P(x1, y1 + 0.52, zBase + 5), P(x0, y1 + 0.52, zBase + 5)],
          'rgba(240,120,40,' + (0.4 * G_ALPHA) + ')', 'rgba(200,90,20,0.7)');
        if (u.f === 0) drawPipeFenceX(x0, x1, y1 + 1.15, 0, '上下作業 立入禁止');
      }
      // 設備：3系統×3段階
      if (!u.atrium) {
        if (ghostOn) drawStageItemsGhost(u.stages.equip, zBase, t);
        drawStageItems(u.stages.equip, zBase, t);
        drawPipeBundle(u, t, zBase);
      }
      if (ghostOn) drawStageItemsGhost(u.stages.interior, zBase, t);
      drawStageItems(u.stages.interior, zBase, t);
      if (!u.atrium && effFocus === u.f)
        drawInteriorProps(u, t, pinf.state === 'done' ? frameTop : zBase);
      if (fadeRoof > 0.03) {
        G_EXTRA = fadeRoof;
        if (ghostOn) drawStageItemsGhost(u.roof, zBase, t);
        drawStageItems(u.roof, zBase, t);
        if (ghostOn) drawStageItemsGhost(u.roofEq, zBase, t);
        drawStageItems(u.roofEq, zBase, t);
        G_EXTRA = 1;
      }

      if (u.atrium && u.f >= 1) {
        var belowU = U(u.f - 1, u.z);
        if (belowU && floorState(belowU, t).state === 'done') {
          drawPipeFenceX(x0, x1, y1 - 0.02, zBase, '立入禁止');
          drawPipeFenceY(x1 - 0.02, y0, y1, zBase, null);
        }
      }
      if (u.f === 0) {
        var frameP0 = stageProg(u.stages.steel, t, true);
        if (frameP0 > 0 && frameP0 < 1) drawPipeFenceX(x0, x1, y1 + 0.95, 0, '作業直下 立入禁止');
      }
      if (fadeFloor[u.f] > 0.5) drawGateMarker(u, t, zBase);

      if (fadeFloor[u.f] > 0.5)
        for (var s2 = 0; s2 < sts.length; s2++) drawSparks(sts[s2], zBase, t);

      var topPoly = [P(x0, y0, frameTop), P(x1, y0, frameTop), P(x1, y1, frameTop), P(x0, y1, frameTop)];
      if (selected === u || hover === u) {
        poly(topPoly, 'rgba(255,255,255,0.18)', '#ffffff');
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(topPoly[0][0], topPoly[0][1]);
        for (var q = 1; q < 4; q++) ctx.lineTo(topPoly[q][0], topPoly[q][1]);
        ctx.closePath(); ctx.stroke();
      }
      if (fadeFloor[u.f] > 0.5) hitPolys.push({ poly: topPoly, target: u });

      if (fadeFloor[u.f] > 0.5)
        drawPeople(u, t, pinf.state === 'done' ? frameTop : zBase);
      if (fadeFloor[u.f] > 0.5)
        drawScaffoldWorkers(u, t, zBase);
      G_ALPHA = 1;
    }

    /* ---------- エレベーター：シャフトはピットから最上階天井まで連続した1本。
       壁・レール・かご・ドアはすべて絶対 z で描く（zBase は 0 固定） ---------- */
    var EV_WALL_COLS = { top: '#c9c2b2', east: '#a79e8d', south: '#bab2a1' };
    function drawEVShaftBox(x0, y0, x1, y1, z0, z1, mode, alpha) {
      if (mode === 'ghost') {
        drawBox(x0, y0, x1, y1, z0, z1,
          { top: '#6eaaff', east: '#6eaaff', south: '#6eaaff' }, { aTop: 0.26 * alpha, aE: 0.16 * alpha, aS: 0.11 * alpha });
        return;
      }
      drawBox(x0, y0, x1, y1, z0, z1, EV_WALL_COLS, { aTop: alpha, aE: 0.95 * alpha, aS: 0.92 * alpha });
    }
    function drawEV(t) {
      if (!EVST || !EVST.items) return;
      var g = EVST.testGate;
      var carOff = 0;
      if (gateState(g, t, true) === 'during') {
        var ph = (performance.now() / 1000 % 7) / 7;
        var tri = ph < 0.5 ? ph * 2 : 2 - ph * 2;
        carOff = (tri * tri * (3 - 2 * tri)) * (FLOORS - 1) * FLOOR_H;
      }
      var carFloor = Math.round(carOff / FLOOR_H);
      G_ALPHA = 1; G_EXTRA = 1;
      if (EVSHAFT) {
        // ピット：1F床（z=FOUND_H）の下にある暗い底＋緩衝器。シャフトの起点は常にここ
        if (effFocus === null || effFocus === 0) {
          var pit = EVSHAFT.pit;
          if (pit.act <= t || (ghostOn && pit.plan <= t)) {
            var pa = effFocus === 0 ? 0.55 : 1;
            poly([P(8.56, 3.82, 1.2), P(9.44, 3.82, 1.2), P(9.44, 4.74, 1.2), P(8.56, 4.74, 1.2)],
              pit.act <= t ? '#57524b' : '#6eaaff', null, pit.act <= t ? pa : 0.3);
            if (pit.act <= t)
              drawBox(8.86, 4.08, 9.14, 4.36, 1.2, 3.4,
                { top: '#4c4a45', east: '#37352f', south: '#413f3a' }, { aTop: pa, aE: pa, aS: pa });
          }
        }
        // シャフト壁：各階セグメントは z0=その階の床高 から z1=z0+FH（絶対z・一回だけ積む）。
        // 乗場開口（opening）は格納データには無く、ここでだけ袖壁＋まぐさに分割して描く
        for (var w = 0; w < EVSHAFT.walls.length; w++) {
          var wl = EVSHAFT.walls[w];
          if (effFocus !== null && wl.fl !== effFocus) continue;
          var wmode = wl.act <= t ? 'solid' : (ghostOn && wl.plan <= t ? 'ghost' : null);
          if (!wmode) continue;
          var wa2 = effFocus === wl.fl ? 0.16 : 1;
          if (wl.opening) {
            drawEVShaftBox(wl.x0, wl.y0, 8.68, wl.y1, wl.z0, wl.z1, wmode, wa2);
            drawEVShaftBox(9.32, wl.y0, wl.x1, wl.y1, wl.z0, wl.z1, wmode, wa2);
            drawEVShaftBox(8.68, wl.y0, 9.32, wl.y1, wl.z0 + 16, wl.z1, wmode, wa2);
          } else {
            drawEVShaftBox(wl.x0, wl.y0, wl.x1, wl.y1, wl.z0, wl.z1, wmode, wa2);
          }
        }
        // シャフト天井＋巻上機（最上階の天井の上）
        if (effFocus === null || effFocus === FLOORS - 1) {
          var topZ = FOUND_H + FLOORS * FLOOR_H;
          var cap = EVSHAFT.cap;
          if (cap.act <= t || (ghostOn && cap.plan <= t))
            drawEVShaftBox(8.34, 3.60, 9.66, 4.96, topZ, topZ + 3, cap.act <= t ? 'solid' : 'ghost', 1);
          var mc = EVSHAFT.machine;
          if (mc.act <= t || (ghostOn && mc.plan <= t))
            drawBox(8.78, 3.98, 9.22, 4.42, topZ + 3, topZ + 9,
              mc.act <= t ? { top: '#596068', east: '#3c4249', south: '#4a5058' } : { top: '#6eaaff', east: '#6eaaff', south: '#6eaaff' },
              mc.act <= t ? { aTop: 1, aE: 0.95, aS: 0.92 } : { aTop: 0.26, aE: 0.16, aS: 0.11 });
        }
      }
      // レール・かご・乗場ドア（絶対z。かごは試運転中だけ昇降オフセットが乗る）
      for (var i = 0; i < EVST.items.length; i++) {
        var it = EVST.items[i];
        if (it.k === 'evcar') {
          if (effFocus !== null && carFloor !== effFocus) continue;
          if (it.act <= t) drawItem(it, 0, 'solid', carOff);
          else if (ghostOn && it.plan <= t) drawItem(it, 0, 'ghost', 0);
        } else {
          if (effFocus !== null && (it.fl || 0) !== effFocus) continue;
          if (it.act <= t) drawItem(it, 0, 'solid');
          else if (ghostOn && it.plan <= t) drawItem(it, 0, 'ghost');
        }
      }
      if (gateState(g, t, true) === 'during' && (effFocus === null || effFocus === FLOORS - 1)) {
        drawPerson(9.7, 5.1, FOUND_H + (FLOORS - 1) * FLOOR_H, 'insp', false);
        var cp = P(9, 4.2, FOUND_H + (FLOORS - 1) * FLOOR_H + 20);
        ctx.save();
        ctx.fillStyle = '#d64545';
        ctx.font = '700 9.5px sans-serif'; ctx.textAlign = 'center';
        var label = '検査中：EV試運転';
        var w2 = 16 + label.length * 9;
        ctx.fillRect(cp[0] - w2 / 2, cp[1] - 24, w2, 14);
        ctx.fillStyle = '#fff';
        ctx.fillText(label, cp[0], cp[1] - 13.5);
        ctx.restore();
      }
      var ep = stageProg(EVST, t, true);
      if (ep > 0 && ep < 1 && t < g.act) {
        var fl = Math.min(FLOORS - 1, Math.floor(ep * FLOORS));
        if (effFocus === null || effFocus === fl) {
          drawWorker(9.0, 5.15, FOUND_H + fl * FLOOR_H + 2, TRADES.ev, false);
          drawWorker(9.75, 5.3, FOUND_H + fl * FLOOR_H + 2, TRADES.ev, true);
          G_POS.fore.ev = [9.75, 5.3, FOUND_H + fl * FLOOR_H + 14];
        }
      }
      G_ALPHA = 1; G_EXTRA = 1;
    }

    /* ---------- 人 ---------- */
    function drawPerson(x, y, z, kind, isForeman) {
      var p = P(x, y, z);
      var s = isForeman ? 1.45 : 1;
      ctx.save();
      ctx.translate(p[0], p[1]);
      ctx.scale(s, s);
      ctx.beginPath(); ctx.ellipse(0, 0.5, 3.4, 1.4, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(30,40,30,0.25)'; ctx.fill();
      var body, helm;
      if (kind === 'sup') { body = '#2c4a7c'; helm = '#ffffff'; }
      else if (kind === 'mgr') { body = '#4a4a52'; helm = '#f5c542'; }
      else if (kind === 'insp') { body = '#37474f'; helm = '#cfd8dc'; }
      else { body = TRADES[kind].dark; helm = isForeman ? '#ffffff' : TRADES[kind].color; }
      ctx.fillStyle = body;
      ctx.fillRect(-2.2, -6.4, 4.4, 6);
      ctx.beginPath(); ctx.arc(0, -8.6, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#f0c8a0'; ctx.fill();
      if (isForeman || kind === 'sup' || kind === 'mgr' || kind === 'insp') {
        ctx.fillStyle = '#333';
        ctx.fillRect(-1.3, -8.9, 0.9, 0.9);
        ctx.fillRect(0.5, -8.9, 0.9, 0.9);
      }
      ctx.beginPath(); ctx.arc(0, -9.2, 2.8, Math.PI, Math.PI * 2);
      ctx.fillStyle = helm;
      ctx.fill();
      ctx.fillRect(-3, -9.4, 6, 0.9);
      ctx.restore();
    }
    function drawWorker(x, y, z, trade, isForeman) {
      drawPerson(x, y, z, tradeKeyOf(trade), isForeman);
    }
    function tradeKeyOf(trade) {
      for (var k in TRADES) if (TRADES[k] === trade) return k;
      return 'steel';
    }

    function drawPeople(u, t, workZ) {
      if (u.atrium) return;
      var act = activeStage(u, t);
      if (!act || act.p <= 0 || act.p >= 1) return;
      if (act.gate) return;
      var st = act.st;
      var trade = TRADES[st.trade];
      var di = Math.floor(t);
      var seed = u.z * 31 + u.f * 57 + di * 3;
      var n = Math.max(2, Math.round(st.crew + (hash(seed) * 4 - 2)));
      var now = performance.now() / 1000;
      var tod = todInfo();
      var floorKey = workZ >= FOUND_H + u.f * FLOOR_H + FLOOR_H - 1 ? u.f : (u.f === 0 ? -1 : u.f);
      if (st.trade === 'exterior') {
        var zb2 = FOUND_H + u.f * FLOOR_H;
        for (var e = 0; e < n; e++) {
          var ex = ZONE_X[u.z] + 0.4 + hash(seed + e * 7.1) * 2.2;
          var ey = BLD.y1 + 0.45;
          var wz2 = zb2 + 13 + (hash(seed + e * 3.7) < act.p ? 16 : 0);
          drawWorker(ex, ey, wz2, trade, false);
        }
        // 職長は地上だが、上下作業の立入禁止エリアの外に立つ
        var fp = pushOut(ZONE_X[u.z] + 0.5, BLD.y1 + 1.05, -1);
        drawWorker(fp[0], fp[1], 0, trade, true);
        G_POS.fore[st.trade] = [fp[0], fp[1], 12];
        return;
      }
      if (st === u.stages.steel && !u.atrium) {
        // 配筋・かご組立の最中は、束のそばと組立先端に人が寄る（PCaでは発生しない）
        var curRb = null, rbAllDone = true, rj, rit;
        var sItems = st.items || [];
        for (rj = 0; rj < sItems.length; rj++) {
          rit = sItems[rj];
          if (rit.k !== 'rebar' && rit.k !== 'cage') continue;
          if (rit.act <= t || rit.act - t <= REBAR_LEAD) curRb = rit;
          if (rit.act > t) rbAllDone = false;
        }
        if (curRb && !rbAllDone) {
          var deckZ = FOUND_H + u.f * FLOOR_H + FLOOR_H;
          var crx = (curRb.x0 + curRb.x1) / 2, cry = (curRb.y0 + curRb.y1) / 2;
          for (var wi = 0; wi < n; wi++) {
            var nearBundle = wi % 2 === 1;
            var wx2 = nearBundle ? ZONE_X[u.z] + 0.8 + hash(seed + wi * 3.3) * 1.1
              : crx + (hash(seed + wi * 7.1) - 0.5) * 1.3;
            var wy2 = nearBundle ? BLD.y1 - 0.55
              : cry + (hash(seed + wi * 13.7) - 0.5) * 1.5;
            var bp = blendPos(wx2, wy2, u.f * 9 + u.z * 3 + wi, tod);
            bp = pushOut(bp[0], bp[1], u.f);
            drawWorker(bp[0], bp[1], deckZ, trade, false);
            if (wi === 0) G_POS.work = [bp[0], bp[1], deckZ + 12];
          }
          drawWorker(ZONE_X[u.z] + 0.55, BLD.y1 - 0.5, deckZ, trade, true);
          G_POS.fore[st.trade] = [ZONE_X[u.z] + 0.55, BLD.y1 - 0.5, deckZ + 14];
          return;
        }
      }
      var x0 = ZONE_X[u.z] + 0.45, x1 = ZONE_X[u.z + 1] - 0.45;
      var y0 = BLD.y0 + 0.5, y1 = BLD.y1 - 0.5;
      for (var i = 0; i < n; i++) {
        var wx = x0 + hash(seed + i * 7.1) * (x1 - x0);
        var wy = y0 + hash(seed + i * 13.7) * (y1 - y0);
        var bob = Math.sin(now * 2.6 + i * 1.7 + seed) * 0.9;
        var bp2 = blendPos(wx, wy, u.f * 9 + u.z * 3 + i, tod);
        bp2 = pushOut(bp2[0], bp2[1], floorKey);
        drawWorker(bp2[0], bp2[1], workZ + bob * 0.4, trade, false);
        if (i === 0) G_POS.work = [bp2[0], bp2[1], workZ + 12];
      }
      var fx = x0 + 0.35 + hash(seed + 99) * 0.5;
      var fy = y1 - 0.35;
      var fp2 = pushOut(fx, fy, floorKey);
      drawWorker(fp2[0], fp2[1], workZ, trade, true);
      G_POS.fore[st.trade] = [fp2[0], fp2[1], workZ + 14];
    }

    function drawGroundCrew(t) {
      var st = null;
      if (stageProg(EARTH, t, true) > 0 && stageProg(EARTH, t, true) < 1) st = EARTH;
      else if (stageProg(FOUND, t, true) > 0 && stageProg(FOUND, t, true) < 1) st = FOUND;
      if (!st) return;
      var di = Math.floor(t);
      var n = st.crew;
      var tod = todInfo();
      for (var i = 0; i < n; i++) {
        var wx = BLD.x0 + 0.6 + hash(di * 5 + i * 9.3) * (BLD.x1 - BLD.x0 - 1.2);
        var wy = BLD.y0 + 0.6 + hash(di * 5 + i * 4.1) * (BLD.y1 - BLD.y0 - 1.2);
        var bp = blendPos(wx, wy, 40 + i, tod);
        bp = pushOut(bp[0], bp[1], -1);
        drawWorker(bp[0], bp[1], 0, TRADES[st.trade], i === 0);
        if (i === 0) { G_POS.work = [bp[0], bp[1], 12]; G_POS.fore[st.trade] = [bp[0], bp[1], 14]; }
      }
    }

    /* ---------- 担当者・課長・監理者 ---------- */
    function drawPeopleGlobal(t) {
      var tod = todInfo();
      var nowS = performance.now() / 1000;
      var supPos;
      if (tod.gather > 0.5 || tod.yurei > 0.5) supPos = [3.45, 6.15, 0]; // 事務所前（西フェンス際）
      else if (tod.rest > 0.5) supPos = [3.3, 7.35, 0];
      else {
        var actives = [];
        for (var i = 0; i < units.length; i++) {
          var a = activeStage(units[i], t);
          if (a && a.p > 0 && a.p < 1) actives.push(units[i]);
        }
        if (effFocus !== null) {
          var fu = null;
          for (var j = 0; j < units.length; j++)
            if (units[j].f === effFocus) { var aa = activeStage(units[j], t); if (aa && aa.p > 0 && aa.p < 1) { fu = units[j]; break; } }
          if (fu) {
            var fs = floorState(fu, t);
            supPos = [ZONE_X[fu.z] + 2.5, BLD.y1 - 0.6, FOUND_H + fu.f * FLOOR_H + (fs.state === 'done' ? FLOOR_H : 0)];
          } else supPos = [3.45, 6.15, 0];
        } else if (actives.length) {
          var idx = Math.floor(nowS / 5) % actives.length;
          var au = actives[idx];
          supPos = [ZONE_X[au.z] + 1.5, BLD.y1 + 1.5, 0]; // 立入禁止エリアの外（南側）から見る
        } else supPos = [3.45, 6.15, 0];
      }
      if (supPos[2] === 0) {
        var so = pushOut(supPos[0], supPos[1], -1);
        supPos = [so[0], so[1], 0];
      }
      var siteStarted = t > 0.3;
      if (siteStarted) {
        drawPerson(supPos[0], supPos[1], supPos[2], 'sup', true);
        G_POS.sup = [supPos[0], supPos[1], supPos[2] + 14];
      }
      var mgrShow = tod.gather > 0.5 || tod.yurei > 0.5 || (nowS % 29) < 7;
      if (siteStarted && mgrShow && effFocus === null) {
        drawPerson(3.35, 5.55, 0, 'mgr', true);
        G_POS.mgr = [3.35, 5.55, 14];
      } else if (!mgrShow) G_POS.mgr = null;
      if (tod.yurei > 0.5 && effFocus === null && siteStarted) {
        var tradesNow = ['steel', 'scaffold', 'exterior', 'interior'];
        for (var k = 0; k < 4; k++) {
          var yy = 4.85 + k * 0.52;
          drawPerson(3.95 + (k % 2) * 0.3, yy, 0, tradesNow[k], true);
        }
      }
    }

    /* ---------- UI ---------- */
    var dayNum = document.getElementById('dayNum');
    var totalDaysEl = document.getElementById('totalDays');
    var phaseEl = document.getElementById('phaseName');
    var planFill = document.getElementById('planFill');
    var actFill = document.getElementById('actFill');
    var planPct = document.getElementById('planPct');
    var actPct = document.getElementById('actPct');
    var lagBadge = document.getElementById('lagBadge');
    var memCount = document.getElementById('memCount');
    var slider = document.getElementById('slider');
    var eventCap = document.getElementById('eventCap');
    var focusStatus = document.getElementById('focusStatus');
    var hint = document.getElementById('hint');
    var card = document.getElementById('card');

    var lastUiKey = '';
    function refreshUI() {
      var key = Math.round(day * 4) + '|' + (selected ? 's' : '');
      dayNum.textContent = Math.floor(day);
      phaseEl.textContent = phaseName(day);
      var pp = Math.round(overallProgress(day, false) * 100);
      var ap = Math.round(overallProgress(day, true) * 100);
      planFill.style.width = pp + '%';
      actFill.style.width = ap + '%';
      planPct.textContent = pp + '%';
      actPct.textContent = ap + '%';
      memCount.textContent = membersPlaced(day, true) + ' / ' + MEM_TOTAL +
        '（計画 ' + membersPlaced(day, false) + '）';
      var lagDays = 0;
      if (pp - ap > 2) {
        for (var d = 0; d <= day; d += 0.25) {
          if (overallProgress(d, false) >= overallProgress(day, true)) { lagDays = day - d; break; }
        }
      }
      if (lagDays >= 1) {
        lagBadge.textContent = '計画より約' + Math.round(lagDays) + '日遅れ';
        lagBadge.classList.add('on');
      } else lagBadge.classList.remove('on');
      if (!sliderActive) {
        slider.value = Math.round(day * 10);

    function toWorld(ev) {
      var r = cv.getBoundingClientRect();
      var px = ev.clientX - r.left, py = ev.clientY - r.top;
      return [(px - view.tx) / view.s, (py - view.ty) / view.s];
    }
    function pick(ev) {
      var w = toWorld(ev);
      for (var i = hitPolys.length - 1; i >= 0; i--) {
        var pl = hitPolys[i];
        if (pointInPoly(w[0], w[1], pl.poly)) return pl.target;
      }
      return null;
    }
    function pointInPoly(x, y, pts) {
      var inside = false;
      for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        var xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
        if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
      }
      return inside;
    }
    var downPos = null;
    cv.addEventListener('pointerdown', function (ev) { downPos = [ev.clientX, ev.clientY]; });
    cv.addEventListener('pointerup', function (ev) {
      if (!downPos) return;
      var dx = ev.clientX - downPos[0], dy = ev.clientY - downPos[1];
      downPos = null;
      if (dx * dx + dy * dy > 36) return;
      var target = pick(ev);
      if (target) select(target);
    });
    cv.addEventListener('pointermove', function (ev) {
      if (ev.pointerType !== 'mouse') return;
      hover = pick(ev);
      cv.style.cursor = hover ? 'pointer' : 'default';
    });

      if (g.kind === 'strength') return { prio: 3, lines: [
        { who: 'insp', text: '強度確認、テストピースの結果は？' },
        { who: 'fore:' + fk, text: '材齢7日で設計強度クリアしてます' },
        { who: 'sup', text: 'では上の階の躯体を始めます' }
      ] };
      if (g.kind === 'product') return { prio: 3, lines: [
        { who: 'insp', text: 'PCaの受入検査。寸法と仕口を見せて' },
        { who: 'fore:' + fk, text: '工場の検査票も揃ってます' },
        { who: 'insp', text: '合格。吊り込みを始めて' }
      ] };
      if (g.kind === 'joint') return { prio: 3, lines: [
        { who: 'insp', text: '接合確認。目地のグラウト、充填は？' },
        { who: 'fore:' + fk, text: 'スリーブ継手も締め切りました' },
        { who: 'sup', text: '合格なら内装に渡します' }
      ] };
      if (g.kind === 'press') return { prio: 3, lines: [
        { who: 'insp', text: '隠蔽前の試験だね。圧力、保持できてる？' },
        { who: 'fore:plumb', text: '水圧かけて30分、落ちてません' },
        { who: 'sup', text: '合格なら写真を撮って、内装に渡します' }
      ] };
      if (g.kind === 'evtest') return { prio: 3, lines: [
        { who: 'insp', text: 'EVの試運転検査、各階の着床を見ます' },
        { who: 'fore:ev', text: '受電も済んで、調整は終わってます' },
        { who: 'insp', text: 'うん、静かだね。この調子で' }
      ] };
      return { prio: 3, lines: [
        { who: 'insp', text: '層間ふさぎ、確認します' },
        { who: 'sup', text: '区画まわり、全部ふさいであります' }
      ] };
    }
    function convWeather() {
      var windy = day >= WIND.from && day < WIND.to + 0.6;
      if (windy) return { prio: 2, lines: [
        { who: 'fore:scaffold', text: '風が強い。今日は揚重なしでいくぞ' },
        { who: 'work', text: '了解。地上の作業に切り替えます' }
      ] };
      return { prio: 2, lines: [
        { who: 'fore:exterior', text: '雨だ。シーリングは中止、養生を先にやる' },
        { who: 'work', text: '材料、濡れないようシート掛けます' }
      ] };
    }
    function convWork() {
      var au = activeUnitNow();
      var tr = au ? au.a.st.trade : 'steel';
      var lines = {
        steel: [['次は西側の柱いくぞ', '玉掛けOK、合図見てて'], ['本締め終わったらデッキだ', 'トルク確認、マーキングした？']],
        frame: [['型枠、あと2枚でこの面終わる', '配筋は束から持ってくる'], ['打設は明日の朝イチ、生コン4台', '配筋検査の立会い、段取り済み？']],
        interior: [['ボード、置場からあと2枚', '台車で運ぶわ'], ['墨、出てる？', 'ここ、基準線から追ってる']],
        elec: [['この配管、先に通しておく？', 'うん、隠蔽前に試験があるから急ごう']],
        plumb: [['継手、もう一回締め確認', '水圧かける前に写真も頼む']],
        hvac: [['ダクト、吊りバンドのピッチ見て', 'あと一区間で繋がる']],
        exterior: [['パネル、あと1枚でこの面終わる', 'シーリングは下段から']],
        scaffold: [['次の段、枠を持ってきて', '壁つなぎ忘れるなよ']],
        roof: [['シートの重ね、こっちから', '風で飛ばないよう押さえて']]
      };
      var pair = pick1(lines[tr] || lines.steel);
      return { prio: 1, lines: [
        { who: 'work:' + tr, text: pair[0] },
        { who: 'work:' + tr, text: pair[1] }
      ] };
    }
    function convFore() {
      var au = activeUnitNow();
      var tr = au ? au.a.st.trade : 'steel';
      return { prio: 1, lines: [
        { who: 'fore:' + tr, text: pick1(['次は奥から詰めていくぞ', '材料は置場にある。二次搬送頼む', '今日中にこの面は終わらせる']) },
        { who: 'work:' + tr, text: pick1(['終わりました。次いきます', '了解です', 'あと少しで区間が繋がります']) }
      ] };
    }
    function convSup() {
      var au = activeUnitNow();
      if (!au) return null;
      var tr = au.a.st.trade;
      var gRebar = au.u.gates.rebar, gPress = au.u.gates.press;
      if (gRebar && gateState(gRebar, day, true) === 'before' && gRebar.act - day < 1.6)
        return { prio: 2, lines: [
          { who: 'fore:' + foremanOfGate(gRebar), text: '配筋が終わります。検査の立会いをお願いします' },
          { who: 'sup', text: '監理者に連絡済み。明日の午前で段取りするよ' }
        ] };
      if (gPress && gateState(gPress, day, true) === 'before' && gPress.act - day < 1.6)
        return { prio: 2, lines: [
          { who: 'fore:plumb', text: '隠蔽前の試験、明日できます' },
          { who: 'sup', text: 'じゃあ内装は合格が出てから。写真も忘れずに' }
        ] };
      var u02 = U(0, 2);
      if (u02 && au.u === u02 && day > EST_DAYS * 0.35 && day < EST_DAYS * 0.55)
        return { prio: 2, lines: [
          { who: 'fore:interior', text: '内装材の搬入が遅れてて…この工区だけ止まってます' },
          { who: 'sup', text: '先にできる所から回そう。工程は組み替える' }
        ] };
      return { prio: 2, lines: [
        { who: 'fore:' + tr, text: pick1(['進捗、予定通りです', 'この調子なら明日には次の段へ', '少し詰まってますが巻き返します']) },
        { who: 'sup', text: pick1(['無理はしないで。詰まったら声かけて', '了解。写真だけ頼むね', 'いいね。その調子で']) }
      ] };
    }
    function convMgr() {
      return { prio: 2, lines: [
        { who: 'sup', text: '課長、来月の工程表、チェックをお願いします' },
        { who: 'mgr', text: pick1(['明日の朝までに見るよ', '検査の日程だけ先に押さえて', '原価は枠内だね、この調子で']) }
      ] };
    }
    var CALLERS = [
      { name: '施主', av: '施', lines: ['引渡しの日程、予定通りいけそうですか？', 'はい、試運転まで含めて間に合います'] },
      { name: '設計者', av: '設', lines: ['仕上げの色番、決まったので共有します', '了解です。職長に展開します'] },
      { name: '本社', av: '本', lines: '月次の進捗写真、今日中に送って', lines2: '承知しました。夕方までに送ります' },
      { name: '業者代理人', av: '業', lines: ['納期、来週の頭で確定しました', '助かります。搬入経路は前日に確認します'] }
    ];
    function convPhone() {
      var c = CALLERS[Math.floor(hash(day * 3.7 + bubSeq) * CALLERS.length) % CALLERS.length];
      var l1 = Array.isArray(c.lines) ? c.lines[0] : c.lines;
      var l2 = Array.isArray(c.lines) ? c.lines[1] : c.lines2;
      return { prio: 2, phone: c, lines: [
        { who: 'sup', phone: true, text: '📞 ' + l1 },
        { who: 'sup', phone: true, text: l2 }
      ] };
    }

    /* ---------- 吹き出し配置：保護矩形と衝突判定 ---------- */
    function protectedRects() {
      var rs = [];
      if (card.classList.contains('on'))
        rs.push({ x: card.offsetLeft, y: card.offsetTop, w: card.offsetWidth, h: card.offsetHeight });
      if (callerChip.classList.contains('on'))
        rs.push({ x: callerChip.offsetLeft, y: callerChip.offsetTop, w: callerChip.offsetWidth, h: callerChip.offsetHeight });
      if (G_POS.lift) {
        var ls = worldToScreen(G_POS.lift[0], G_POS.lift[1], G_POS.lift[2]);
        rs.push({ x: ls[0] - 46, y: ls[1] - 46, w: 92, h: 92 });
      }
      if (eventCap.classList.contains('on')) {
        var sr = stageEl.getBoundingClientRect(), er = eventCap.getBoundingClientRect();
        rs.push({ x: er.left - sr.left, y: er.top - sr.top, w: er.width, h: er.height });
      }
      return rs;
    }
    function rectHit(a, b, m) {
      return a.x - m < b.x + b.w && a.x + a.w + m > b.x && a.y - m < b.y + b.h && a.y + a.h + m > b.y;
    }
    function tryPlace(el, ax, ay) {
      var w = el.offsetWidth, h = el.offsetHeight;
      var W = view.w, H = view.h;
      var cands = [
        [ax - w / 2, ay - h - 18],
        [ax - w - 10, ay - h - 12],
        [ax + 10, ay - h - 12],
        [ax - w - 14, ay - h / 2],
        [ax + 14, ay - h / 2],
        [ax - w / 2, ay - h - 52]
      ];
      var prot = protectedRects();
      var placed = bubActive.map(function (b) { return { x: b.x, y: b.y, w: b.w, h: b.h }; });
      for (var i = 0; i < cands.length; i++) {
        var x = Math.max(4, Math.min(W - w - 4, cands[i][0]));
        var y = Math.max(4, Math.min(H - h - 4, cands[i][1]));
        var r = { x: x, y: y, w: w, h: h };
        var ok = true;
        for (var j = 0; j < prot.length && ok; j++) if (rectHit(r, prot[j], 5)) ok = false;
        for (var k = 0; k < placed.length && ok; k++) if (rectHit(r, placed[k], 6)) ok = false;
        if (ok) return { x: x, y: y, dx: x - ax, dy: y - ay };
      }
      return null;
    }
    function showMini(anchorPos) {
      var s = worldToScreen(anchorPos[0], anchorPos[1], anchorPos[2]);
      var el = document.createElement('div');
      el.className = 'bubmini';
      el.textContent = '💬';
      el.style.left = (s[0] + 8) + 'px';
      el.style.top = (s[1] - 26) + 'px';
      bubLayer.appendChild(el);
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1300);
    }
    function spawnConv(conv) {
      if (!conv || !conv.lines || !conv.lines.length) return;
      if (bubActive.length >= BUB_MAX) {
        if (conv.prio >= 2 && bubQueue.length < 2) bubQueue.push(conv);
        return;
      }
      var first = speakerInfo(conv.lines[0].who);
      if (!first.pos) { if (conv.prio >= 2 && bubQueue.length < 2) bubQueue.push(conv); return; }
      var el = document.createElement('div');
      el.className = 'bub' + (conv.phone ? ' phone' : '');
      el.style.visibility = 'hidden';
      bubLayer.appendChild(el);
      var b = { conv: conv, el: el, idx: -1, until: 0, x: 0, y: 0, w: 0, h: 0, dx: 0, dy: 0, anchorKey: conv.lines[0].who };
      bubActive.push(b);
      advanceBubble(b, performance.now(), true);
    }
    function advanceBubble(b, now, firstTry) {
      b.idx++;
      if (b.idx >= b.conv.lines.length) { endBubble(b); return; }
      var line = b.conv.lines[b.idx];
      var info = speakerInfo(line.who);
      if (!info.pos) { endBubble(b); return; }
      b.anchorKey = line.who;
      b.el.innerHTML = '<span class="who" style="background:' + info.color + '">' + info.name + '</span><br>' +
        line.text.replace(/</g, '&lt;') + '<span class="tail"></span>';
      var s = worldToScreen(info.pos[0], info.pos[1], info.pos[2]);
      b.el.style.visibility = 'hidden';
      b.el.style.left = '0px'; b.el.style.top = '0px';
      var placed = tryPlace(b.el, s[0], s[1]);
      if (!placed) {
        if (firstTry && b.conv.prio <= 1) {
          showMini(info.pos);
          endBubble(b);
          return;
        }
        placed = { x: Math.max(4, s[0] - 60), y: Math.max(4, s[1] - 120), dx: 0, dy: -120 };
        placed.dx = placed.x - s[0]; placed.dy = placed.y - s[1];
      }
      b.x = placed.x; b.y = placed.y; b.dx = placed.dx; b.dy = placed.dy;
      b.w = b.el.offsetWidth; b.h = b.el.offsetHeight;
      b.el.style.left = b.x + 'px';
      b.el.style.top = b.y + 'px';
      b.el.style.visibility = 'visible';
      var tail = b.el.querySelector('.tail');
      if (tail) {
        var txx = Math.max(8, Math.min(b.w - 16, s[0] - b.x - 4));
        tail.style.left = txx + 'px';
        tail.style.top = (b.h - 6) + 'px';
      }
      if (b.conv.phone) {
        callerChip.classList.add('on');
        document.getElementById('callerAv').textContent = b.conv.phone.av;
        document.getElementById('callerName').textContent = b.conv.phone.name + ' から電話';
      }
      b.until = now + 1500 + line.text.length * 42;
    }
    function endBubble(b) {
      var i = bubActive.indexOf(b);
      if (i >= 0) bubActive.splice(i, 1);
      if (b.el.parentNode) b.el.parentNode.removeChild(b.el);
      if (b.conv.phone) callerChip.classList.remove('on');
      if (bubQueue.length && bubActive.length < BUB_MAX) {
        var q = bubQueue.shift();
        setTimeout(function () { spawnConv(q); }, 250);
      }
    }
    function clearBubbles() {
      for (var i = bubActive.length - 1; i >= 0; i--) endBubble(bubActive[i]);
      bubQueue = [];
      bubActive = [];
      callerChip.classList.remove('on');
    }
    function tickBubbles(now) {
      if (!bubblesOn) return;
      for (var i = bubActive.length - 1; i >= 0; i--) {
        var b = bubActive[i];
        if (now >= b.until) { advanceBubble(b, now, false); continue; }
        var info = speakerInfo(b.anchorKey);
        if (info.pos) {
          var s = worldToScreen(info.pos[0], info.pos[1], info.pos[2]);
          b.x = s[0] + b.dx; b.y = s[1] + b.dy;
          b.el.style.left = b.x + 'px';
          b.el.style.top = b.y + 'px';
        }
      }
      if (!playing || speed > 2 || sliderActive || day <= 0.2) return;
      var tod = todInfo();
      var cyc = Math.floor(now / TOD_LEN);
      if (tod.gather > 0.75 && bubLastCycle !== cyc && day > 1) { bubLastCycle = cyc; spawnConv(convAsa()); return; }
      if (tod.yurei > 0.75 && bubLastYuCycle !== cyc && day > 1) { bubLastYuCycle = cyc; spawnConv(convYu()); return; }
      var ag = anyGateDuring(day);
      var gk = ag ? ag.g.kind + '@' + Math.floor(day * 2) : '';
      if (ag && gk !== bubLastGateKey) { bubLastGateKey = gk; spawnConv(convGate(ag.g, ag.u)); return; }
      if (EVST && gateState(EVST.testGate, day, true) === 'during' && bubLastGateKey !== 'evt') {
        bubLastGateKey = 'evt'; spawnConv(convGate(EVST.testGate, null)); return;
      }
      if (now < bubNextSpawn) return;
      bubNextSpawn = now + 3400 + hash(now / 613) * 2600;
      bubSeq++;
      var r = hash(bubSeq * 3.17 + day);
      var rainy = (day >= RAIN.from && day < RAIN.to) || (day >= RAIN2.from && day < RAIN2.to);
      var windy = day >= WIND.from && day < WIND.to + 0.6;
      if ((rainy || windy) && r < 0.30) spawnConv(convWeather());
      else if (r < 0.42 && G_POS.mgr) spawnConv(convMgr());
      else if (r < 0.54) spawnConv(convPhone());
      else if (r < 0.72) { var cs = convSup(); if (cs) spawnConv(cs); else spawnConv(convFore()); }
      else if (r < 0.87) spawnConv(convFore());
      else spawnConv(convWork());
    }

    /* ---------- 凡例 ---------- */
    (function buildLegend() {
      var el = document.getElementById('legend');
      var keys = ['earth', 'steel', 'frame', 'scaffold', 'elec', 'plumb', 'hvac', 'interior', 'exterior', 'insp', 'ev'];
      var html = '';
      for (var i = 0; i < keys.length; i++) {
        html += '<span class="li"><span class="dot" style="background:' + TRADES[keys[i]].color + '"></span>' + TRADES[keys[i]].name + '</span>';
      }
      html += '<span class="li"><span class="ghostdot"></span>計画ゴースト（まだ付いていない部材）</span>';
      html += '<span class="li">パラメータを変えると現場が再生成される（P-rule：PCaはRC/SRCのみ）</span>';
      html += '<span class="li">躯体テンプレート：S＝節建方＋本締め確認／RC＝型枠→配筋→検査→打設→養生→脱型・強度確認／PCa＝吊り込み＋接合確認</span>';
      html += '<span class="li">外装・足場は全4面。どの回転でも見える2面が描かれる</span>';
      html += '<span class="li">立入禁止エリア（柵の中）には人を配置しない。事務所は西フェンス際に常駐し、搬入動線（青破線）を塞がない</span>';
      html += '<span class="li">EVシャフトはピット（1F床下）から最上階天井まで連続した1本</span>';
      html += '<span class="li">雨は打設・シーリングだけ、強風は揚重だけを止める。産廃は搬出され、型枠は転用される</span>';
      html += '<span class="li">日内リズム：朝礼→作業→昼休み→作業→夕礼。会話の吹き出しは状況連動</span>';
      html += '<span class="li">「回転」ボタンで視点を4方向に切り替えられます</span>';
      el.innerHTML = html;
    })();

    /* ---------- 初期生成とメインループ ---------- */
    buildModel();
    slider.max = String(TOTAL_DAYS * 10);
    totalDaysEl.textContent = TOTAL_DAYS;
    buildFocusButtons();
    syncParamUI();

    function frame(ts) {
      var dt = Math.min(0.05, (ts - lastTs) / 1000 || 0);
      lastTs = ts;
      if (playing) {
        day += dt * 1.15 * speed;
        if (day >= TOTAL_DAYS) { day = TOTAL_DAYS; setPlaying(false); }
      }
      updateFades(dt);
      draw();
      refreshUI();
      tickBubbles(ts);
      requestAnimationFrame(frame);
    }
    resize();
    requestAnimationFrame(frame);
    </script>
  </body>
